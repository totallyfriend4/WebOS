  function damageEnemy(e, n) {
    e.hp -= n; e.hurt = 0.15; if (e.st === 'idle') e.st = 'chase';
    if (e.hp > 0) { if (Math.random() < 0.4) e.stun = 0.25; return; }
    e.st = 'dead'; kills++; sfx('die');
    if (e.type === 'brute') pickups.push({ x: e.x, y: e.y, t: 'ammo', amt: 4 });
    if (kills === enemies.length) { state = 'won'; endT = 0; }
  }
  function fire() {
    P.cool = 0.75; P.ammo--; recoil = 1; sfx('shot');
    for (const e of enemies) if (e.st === 'idle' && Math.hypot(e.x - P.x, e.y - P.y) < 11) e.st = 'chase';
    for (let i = 0; i < 6; i++) {
      const ang = P.a + (i === 0 ? 0 : (Math.random() - 0.5) * 0.14);
      const wd = castDist(P.x, P.y, ang), ux = Math.cos(ang), uy = Math.sin(ang);
      let best = null, bd = wd;
      for (const e of enemies) {
        if (e.st === 'dead') continue;
        const ex = e.x - P.x, ey = e.y - P.y, along = ex * ux + ey * uy;
        if (along < 0.1 || along > bd) continue;
        if (Math.abs(ex * uy - ey * ux) < 0.34) { best = e; bd = along; }
      }
      if (best) damageEnemy(best, 9 + ((Math.random() * 4) | 0));
    }
  }

  /* ---------- Input ---------- */
  const keys = new Set();
  const T = { fwd: 0, back: 0, sl: 0, sr: 0, tl: 0, tr: 0, fire: 0 };
  let mouseFire = false, lookId = -1, lookX = 0;
  const GAMEKEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyF', 'ControlLeft', 'ControlRight', 'KeyR']);

  function onKeyDown(e) {
    if (activeWin !== win || isLocked() || !GAMEKEYS.has(e.code)) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    e.preventDefault();
    keys.add(e.code);
    if (e.code === 'KeyR' && (state === 'dead' || state === 'won')) { reset(); state = 'play'; P.cool = 0.4; }
  }
  const onKeyUp = (e) => keys.delete(e.code);
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);

  cv.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') {
      mouseFire = true;
      if (document.pointerLockElement !== cv) {
        try { const p = cv.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (_) {}
      }
    } else {
      lookId = e.pointerId; lookX = e.clientX;
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    }
  });
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' && e.pointerId === lookId) { P.a += (e.clientX - lookX) * 0.01; lookX = e.clientX; }
  });
  const endLook = (e) => { if (e.pointerId === lookId) lookId = -1; };
  cv.addEventListener('pointerup', endLook);
  cv.addEventListener('pointercancel', endLook);
  const onDocUp = (e) => { if (e.pointerType === 'mouse') mouseFire = false; };
  const onMouseMove = (e) => {
    if (document.pointerLockElement === cv && activeWin === win && state === 'play') P.a += e.movementX * 0.0025;
  };
  document.addEventListener('pointerup', onDocUp);
  document.addEventListener('mousemove', onMouseMove);

  body.querySelectorAll('.fps-touch button').forEach((b) => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); T[k] = 1; try { b.setPointerCapture(e.pointerId); } catch (_) {} });
    const off = () => { T[k] = 0; };
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  /* ---------- Update ---------- */
  function update(dt) {
    clock += dt;
    hurtFlash = Math.max(0, hurtFlash - dt * 1.5);
    pickFlash = Math.max(0, pickFlash - dt * 2);
    recoil = Math.max(0, recoil - dt * 3);
    msgT = Math.max(0, msgT - dt);
    P.cool = Math.max(0, P.cool - dt);

    const firing = keys.has('Space') || keys.has('KeyF') || keys.has('ControlLeft') || keys.has('ControlRight') || T.fire || mouseFire;

    if (state === 'title') { if (firing) { state = 'play'; P.cool = 0.4; } return; }
    if (state === 'dead' || state === 'won') {
      endT += dt;
      if (endT > 1 && firing) { reset(); state = 'play'; P.cool = 0.4; }
      return;
    }

    // Player movement
    const fwd = (keys.has('KeyW') || keys.has('ArrowUp') || T.fwd ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') || T.back ? 1 : 0);
    const strafe = (keys.has('KeyD') || T.sr ? 1 : 0) - (keys.has('KeyA') || T.sl ? 1 : 0);
    const turn = (keys.has('ArrowRight') || T.tr ? 1 : 0) - (keys.has('ArrowLeft') || T.tl ? 1 : 0);
    P.a += turn * 2.4 * dt;
    const dirX = Math.cos(P.a), dirY = Math.sin(P.a);
    let mx = dirX * fwd - dirY * strafe, my = dirY * fwd + dirX * strafe;
    const len = Math.hypot(mx, my);
    if (len > 1) { mx /= len; my /= len; }
    if (len > 0) bobT += dt * 9;
    moveEntity(P, mx * 3 * dt, my * 3 * dt, 0.22);

    // Shooting
    if (firing && P.cool <= 0) {
      if (P.ammo > 0) fire();
      else { P.cool = 0.4; say('OUT OF AMMO'); }
    }

    // Pickups
    for (let i = pickups.length - 1; i >= 0; i--) {
      const k = pickups[i];
      if (Math.hypot(k.x - P.x, k.y - P.y) > 0.6) continue;
      if (k.t === 'health') {
        if (P.hp >= 100) continue;
        P.hp = Math.min(100, P.hp + k.amt); say('+' + k.amt + ' HEALTH');
      } else { P.ammo += k.amt; say('+' + k.amt + ' SHELLS'); }
      pickFlash = 0.5; sfx('pick'); pickups.splice(i, 1);
    }

    // Enemies
    computeFlow();
    for (const e of enemies) {
      if (e.st === 'dead') continue;
      e.hurt = Math.max(0, e.hurt - dt); e.cd -= dt;
      if (e.stun > 0) { e.stun -= dt; continue; }
      const d = Math.hypot(P.x - e.x, P.y - e.y), seen = los(e.x, e.y, P.x, P.y);
      if (e.st === 'idle') { if (seen && d < 13) e.st = 'chase'; continue; }
      const def = TYPES[e.type];
      let want = def.ranged ? !(seen && d < 4.2) : d > 0.9;
      if (want) {
        let tx = P.x, ty = P.y;
        if (!(seen && d < 3)) { const s = stepTarget(e); if (s) { tx = s.x; ty = s.y; } }
        const dx = tx - e.x, dy = ty - e.y, l = Math.hypot(dx, dy) || 1;
        moveEntity(e, dx / l * def.speed * dt, dy / l * def.speed * dt, 0.25);
      }
      if (def.ranged) {
        if (seen && d < 14 && e.cd <= 0) {
          const ang = Math.atan2(P.y - e.y, P.x - e.x) + (Math.random() - 0.5) * 0.08;
          shots.push({ x: e.x, y: e.y, dx: Math.cos(ang), dy: Math.sin(ang), life: 6 });
          e.cd = 1.5 + Math.random() * 1.2; sfx('fb');
        }
      } else if (d < 1.0 && e.cd <= 0) {
        hurtPlayer(8 + ((Math.random() * 7) | 0)); e.cd = 0.9;
      }
    }
    // keep enemies from stacking on each other
    for (let i = 0; i < enemies.length; i++) {
      const a = enemies[i]; if (a.st === 'dead') continue;
      for (let j = i + 1; j < enemies.length; j++) {
        const b = enemies[j]; if (b.st === 'dead') continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d > 0 && d < 0.5) {
          const push = (0.5 - d) / 2 / d;
          moveEntity(a, -dx * push, -dy * push, 0.25); moveEntity(b, dx * push, dy * push, 0.25);
        }
      }
    }

    // Fireballs
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      s.x += s.dx * 4.6 * dt; s.y += s.dy * 4.6 * dt; s.life -= dt;
      if (s.life <= 0 || solid(s.x, s.y)) { shots.splice(i, 1); continue; }
      if (Math.hypot(s.x - P.x, s.y - P.y) < 0.35) { hurtPlayer(8 + ((Math.random() * 7) | 0)); shots.splice(i, 1); }
    }
  }

  /* ---------- Rendering ---------- */
  function render() {
    const dirX = Math.cos(P.a), dirY = Math.sin(P.a);
    const planeX = -dirY * PLANE, planeY = dirX * PLANE;
    const px = P.x, py = P.y;

    for (let y = 0; y < H; y++) buf.fill(y < H / 2 ? ceilRow[y] : floorRow[y], y * W, y * W + W);

    for (let x = 0; x < W; x++) {
      const camX = 2 * x / W - 1;
      const rdx = dirX + planeX * camX, rdy = dirY + planeY * camX;
      let mx = px | 0, my = py | 0;
      const ddx = Math.abs(1 / rdx), ddy = Math.abs(1 / rdy);
      let sdx, sdy, stepX, stepY;
      if (rdx < 0) { stepX = -1; sdx = (px - mx) * ddx; } else { stepX = 1; sdx = (mx + 1 - px) * ddx; }
      if (rdy < 0) { stepY = -1; sdy = (py - my) * ddy; } else { stepY = 1; sdy = (my + 1 - py) * ddy; }
      let side = 0, hit = 0;
      for (let i = 0; i < 64 && !hit; i++) {
        if (sdx < sdy) { sdx += ddx; mx += stepX; side = 0; } else { sdy += ddy; my += stepY; side = 1; }
        hit = MAPW[my * MW + mx];
      }
      let perp = side === 0 ? sdx - ddx : sdy - ddy;
      if (perp < 0.05) perp = 0.05;
      zbuf[x] = perp;
      const lh = (H / perp) | 0;
      let wx = side === 0 ? py + perp * rdy : px + perp * rdx;
      wx -= Math.floor(wx);
      let tx = (wx * 64) | 0;
      if ((side === 0 && rdx > 0) || (side === 1 && rdy < 0)) tx = 63 - tx;
      const start = (H >> 1) - (lh >> 1);
      const y0 = Math.max(0, start), y1 = Math.min(H - 1, start + lh - 1);
      const tex = WALL_TEX[(hit || 1) - 1];
      const f = Math.max(0.1, Math.min(1, 1.2 - perp / 13)) * (side ? 0.72 : 1);
      const stp = 64 / lh;
      let tp = (y0 - start) * stp;
      for (let y = y0; y <= y1; y++) {
        const c = tex[(((tp | 0) & 63) << 6) + tx];
        tp += stp;
        buf[y * W + x] = (255 << 24) | ((((c >> 16) & 255) * f | 0) << 16) | ((((c >> 8) & 255) * f | 0) << 8) | ((c & 255) * f | 0);
      }
    }

    // Sprites
    const list = [];
    for (const e of enemies) {
      const def = TYPES[e.type];
      if (e.st === 'dead') list.push({ x: e.x, y: e.y, tex: SPR.corpse, scale: 0.7, lift: 0 });
      else list.push({ x: e.x, y: e.y, tex: SPR[def.tex], scale: def.scale, lift: def.lift + (def.ranged ? Math.sin(clock * 3 + e.id) * 0.04 : 0), hurt: e.hurt > 0 });
    }
    for (const k of pickups) list.push({ x: k.x, y: k.y, tex: SPR[k.t], scale: 0.4, lift: 0, bright: true });
    for (const s of shots) list.push({ x: s.x, y: s.y, tex: SPR.fireball, scale: 0.35, lift: 0.3, bright: true });
    for (const s of list) s.d = (s.x - px) * (s.x - px) + (s.y - py) * (s.y - py);
    list.sort((a, b) => b.d - a.d);
    const invDet = 1 / (planeX * dirY - dirX * planeY);
    for (const s of list) {
      const sx = s.x - px, sy = s.y - py;
      const tX = invDet * (dirY * sx - dirX * sy), tY = invDet * (-planeY * sx + planeX * sy);
      if (tY < 0.15) continue;
      const screenX = (W / 2) * (1 + tX / tY);
      const sh = Math.abs(H / tY) * s.scale, sw = sh;
      const bottom = H / 2 + H / (2 * tY) - s.lift * H / tY, top = bottom - sh;
      const x0 = Math.max(0, (screenX - sw / 2) | 0), x1 = Math.min(W - 1, (screenX + sw / 2) | 0);
      const y0 = Math.max(0, top | 0), y1 = Math.min(H - 1, bottom | 0);
      const f = s.bright ? 1 : Math.max(0.15, Math.min(1, 1.2 - tY / 13));
      for (let x = x0; x <= x1; x++) {
        if (tY >= zbuf[x]) continue;
        const txx = ((x - (screenX - sw / 2)) * 64 / sw) | 0;
        if (txx < 0 || txx > 63) continue;
        for (let y = y0; y <= y1; y++) {
          const tyy = ((y - top) * 64 / sh) | 0;
          if (tyy < 0 || tyy > 63) continue;
          const c = s.tex[(tyy << 6) + txx];
          if ((c >>> 24) < 128) continue;
          let r = (c & 255) * f, g = ((c >> 8) & 255) * f, b = ((c >> 16) & 255) * f;
          if (s.hurt) { r = Math.min(255, r + 110); g *= 0.6; b *= 0.6; }
          buf[y * W + x] = (255 << 24) | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0);
        }
      }
    }

    ctx.putImageData(img, 0, 0);
    drawWeapon();
    drawHud();
  }

  function drawWeapon() {
    if (state === 'dead') return;
    const moving = keys.size && (keys.has('KeyW') || keys.has('KeyS') || keys.has('ArrowUp') || keys.has('ArrowDown') || keys.has('KeyA') || keys.has('KeyD')) || T.fwd || T.back;
    const bx = moving ? Math.sin(bobT) * 4 : 0, by = moving ? Math.abs(Math.cos(bobT)) * 4 : 0;
    const kick = recoil * 16, cx = W / 2 + bx, top = 118 + by + kick;
    if (recoil > 0.7) {
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath(); ctx.moveTo(cx - 4, top); ctx.lineTo(cx - 20, top - 18); ctx.lineTo(cx - 6, top - 10); ctx.lineTo(cx, top - 32); ctx.lineTo(cx + 6, top - 10); ctx.lineTo(cx + 20, top - 18); ctx.lineTo(cx + 4, top); ctx.fill();
      ctx.fillStyle = '#fff6c0'; ctx.beginPath(); ctx.arc(cx, top - 4, 7, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#26262b'; ctx.fillRect(cx - 14, top, 28, H - top);
    ctx.fillStyle = '#44444c'; ctx.fillRect(cx - 11, top, 6, H - top);
    ctx.fillStyle = '#111'; ctx.fillRect(cx - 12, top, 24, 4);
    ctx.fillStyle = '#6b4423'; ctx.fillRect(cx - 20, top + 40, 40, 26);
    ctx.fillStyle = '#8a5a30'; ctx.fillRect(cx - 20, top + 40, 40, 5);
    ctx.fillStyle = '#c98a5a'; ctx.fillRect(cx - 26, top + 48, 14, 16); ctx.fillRect(cx + 12, top + 48, 14, 16);
  }

  function drawHud() {
    if (hurtFlash > 0) { ctx.fillStyle = `rgba(200,0,0,${Math.min(0.55, hurtFlash * 0.7)})`; ctx.fillRect(0, 0, W, H); }
    if (pickFlash > 0) { ctx.fillStyle = `rgba(255,230,120,${pickFlash * 0.3})`; ctx.fillRect(0, 0, W, H); }
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(W / 2 - 1, H / 2 - 5, 2, 3); ctx.fillRect(W / 2 - 1, H / 2 + 2, 2, 3);
    ctx.fillRect(W / 2 - 5, H / 2 - 1, 3, 2); ctx.fillRect(W / 2 + 2, H / 2 - 1, 3, 2);
    ctx.fillStyle = 'rgba(10,10,14,0.85)'; ctx.fillRect(0, H - 20, W, 20);
    ctx.font = 'bold 11px monospace'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillStyle = P.hp < 30 ? '#ff5252' : '#ff9a9a'; ctx.fillText('HEALTH ' + P.hp + '%', 8, H - 7);
    ctx.fillStyle = P.ammo < 4 ? '#ff5252' : '#ffd24a'; ctx.fillText('SHELLS ' + P.ammo, 118, H - 7);
    ctx.fillStyle = '#9ad0ff'; ctx.fillText('KILLS ' + kills + '/' + enemies.length, 222, H - 7);
    if (msgT > 0) { ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(msg, W / 2, 24); }

    if (state === 'title') banner('GLOOM', ['Kill every demon.', 'Move: WASD   Turn: arrows / mouse', 'Fire: Space, click or FIRE button', '- fire to start -'], '#ff5a3c');
    else if (state === 'dead') banner('YOU DIED', ['- fire or press R to retry -'], '#ff3030');
    else if (state === 'won') banner('LEVEL CLEAR', ['All demons slain.', '- fire or press R to play again -'], '#6ee07a');
  }
  function banner(title, lines, col) {
    const h = 36 + lines.length * 15, y = (H - 20 - h) / 2 | 0;
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, y, W, h);
    ctx.textAlign = 'center'; ctx.fillStyle = col; ctx.font = 'bold 24px monospace'; ctx.fillText(title, W / 2, y + 28);
    ctx.fillStyle = '#ddd'; ctx.font = '11px monospace';
    lines.forEach((t, i) => ctx.fillText(t, W / 2, y + 48 + i * 15));
    ctx.textAlign = 'left';
  }
  function drawPaused() {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 18px monospace'; ctx.fillText('PAUSED', W / 2, H / 2 - 4);
    ctx.font = '11px monospace'; ctx.fillStyle = '#ccc'; ctx.fillText('click this window to resume', W / 2, H / 2 + 14);
    ctx.textAlign = 'left';
  }

  /* ---------- Main loop ---------- */
  let raf = 0, last = performance.now(), pausedShown = false;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (win.el.classList.contains('hidden')) { last = now; return; }
    if (activeWin !== win || isLocked()) {
      keys.clear(); mouseFire = false;
      if (!pausedShown) { drawPaused(); pausedShown = true; }
      last = now; return;
    }
    pausedShown = false;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    render();
  }
  raf = requestAnimationFrame(frame);

  win.onClose = () => {
    cancelAnimationFrame(raf);
    document.removeEventListener('keydown', onKeyDown);
    document.removeEventListener('keyup', onKeyUp);
    document.removeEventListener('pointerup', onDocUp);
    document.removeEventListener('mousemove', onMouseMove);
    try { if (document.pointerLockElement === cv) document.exitPointerLock(); } catch (_) {}
    try { if (ac) ac.close(); } catch (_) {}
  };
}

/* ---- Minesweeper ---- */
function minesweeperApp(body, win) {
  const R = 9, CC = 9, M = 10;
  body.innerHTML = `
    <div class="game">
      <div class="g-top">
        <span class="left"></span>
        <button class="g-btn flag">&#128681; Flag: off</button>
        <button class="g-btn restart">&#128512;</button>
      </div>
      <div class="mgrid"></div>
    </div>`;

  const grid = $('.mgrid', body);
  const leftEl = $('.left', body);
  const flagBtn = $('.flag', body);
  const faceBtn = $('.restart', body);
  const colors = ['', '#60a5fa', '#4ade80', '#f87171', '#c084fc', '#fbbf24', '#22d3ee', '#e5e7eb', '#9ca3af'];

  let cells, placed, lost, won, flagMode, flags, revealed;

  function neighbors(i) {
    const r = Math.floor(i / CC), c = i % CC, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < R && nc >= 0 && nc < CC) out.push(nr * CC + nc);
    }
    return out;
  }

  function placeMines(safe) {
    const banned = new Set([safe, ...neighbors(safe)]);
    let count = 0;
    while (count < M) {
      const i = Math.floor(Math.random() * R * CC);
      if (banned.has(i) || cells[i].mine) continue;
      cells[i].mine = true;
      count++;
    }
    cells.forEach((c, i) => { c.n = neighbors(i).filter(j => cells[j].mine).length; });
    placed = true;
  }

  function openFrom(i) {
    const stack = [i];
    while (stack.length) {
      const k = stack.pop(), c = cells[k];
      if (c.open || c.flag) continue;
      c.open = true;
      revealed++;
      if (c.n === 0 && !c.mine) neighbors(k).forEach(j => stack.push(j));
    }
  }

  function toggleFlag(i) {
    const c = cells[i];
    if (c.open || lost || won) return;
    c.flag = !c.flag;
    flags += c.flag ? 1 : -1;
    render();
  }

  function reveal(i) {
    if (lost || won) return;
    if (flagMode) { toggleFlag(i); return; }
    const c = cells[i];
    if (c.flag || c.open) return;
    if (!placed) placeMines(i);
    if (c.mine) {
      lost = true;
      c.boom = true;
    } else {
      openFrom(i);
      if (revealed === R * CC - M) won = true;
    }
    render();
  }

  function render() {
    grid.innerHTML = '';
    cells.forEach((c, i) => {
      const el = document.createElement('button');
      el.className = 'mcell';
      let text = '';
      if (c.open) {
        el.classList.add('open');
        if (c.n > 0) { text = c.n; el.style.color = colors[c.n]; }
      } else if (c.flag) {
        text = '\u{1F6A9}';
      } else if (lost && c.mine) {
        el.classList.add('open');
        text = '\u{1F4A3}';
      }
      if (c.boom) el.classList.add('boom');
      el.textContent = text;
      el.addEventListener('click', () => reveal(i));
      el.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleFlag(i); });
      grid.appendChild(el);
    });
    leftEl.textContent = '\u{1F4A3} ' + (M - flags);
    faceBtn.textContent = lost ? '\u{1F635}' : won ? '\u{1F60E}' : '\u{1F600}';
    flagBtn.textContent = '\u{1F6A9} Flag: ' + (flagMode ? 'on' : 'off');
  }

  function reset() {
    cells = Array.from({ length: R * CC }, () => ({ mine: false, open: false, flag: false, n: 0, boom: false }));
    placed = false; lost = false; won = false; flags = 0; revealed = 0;
    render();
  }

  flagMode = false;
  flagBtn.addEventListener('click', () => { flagMode = !flagMode; render(); });
  faceBtn.addEventListener('click', reset);
  reset();
}

/* =========================================================
   System services: toasts, dialogs, file system
   ========================================================= */
function notify(title, text) {
  const t = document.createElement('div');
  t.className = 'toast';
  const b = document.createElement('b');
  b.textContent = title;
  t.appendChild(b);
  if (text) t.appendChild(document.createTextNode(text));
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function showDialog({ title, message = '', input = false, inputType = 'text', def = '', cancel = true }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'modal';
    ov.innerHTML = `<div class="dlg"><div class="dlg-t"></div><div class="dlg-m"></div>${input ? '<input class="dlg-in" autocomplete="off">' : ''}<div class="dlg-b">${cancel ? '<button class="g-btn secondary cancel">Cancel</button>' : ''}<button class="g-btn ok">OK</button></div></div>`;
    $('.dlg-t', ov).textContent = title;
    $('.dlg-m', ov).textContent = message;
    const inp = $('.dlg-in', ov);
    if (inp) { inp.type = inputType; inp.value = def; }
    document.body.appendChild(ov);
    const done = (v) => { ov.remove(); resolve(v); };
    $('.ok', ov).addEventListener('click', () => done(input ? inp.value : true));
    const c = $('.cancel', ov);
    if (c) c.addEventListener('click', () => done(input ? null : false));
    ov.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') done(input ? inp.value : true);
      if (e.key === 'Escape') done(input ? null : false);
    });
    (inp || $('.ok', ov)).focus();
    if (inp) inp.select();
  });
}
const osPrompt = (title, message, def, inputType) => showDialog({ title, message, input: true, def, inputType });
const osConfirm = (title, message) => showDialog({ title, message });
const osAlert = (title, message) => showDialog({ title, message, cancel: false });

/* ---- Virtual file system (saved in localStorage) ---- */
const FS_KEY = 'fs';
const fsListeners = new Set();

function defaultFS() {
  return { type: 'dir', children: {
    Documents: { type: 'dir', children: {
      'welcome.txt': { type: 'file', content: 'Welcome to WebOS!\n\nThis is a tiny operating system that runs in your browser.\nTry the Terminal (type "help"), the Files app and the Task Manager.\n' }
    } },
    Downloads: { type: 'dir', children: {} },
    Pictures: { type: 'dir', children: {} },
    Trash: { type: 'dir', children: {} }
  } };
}

let fsRoot = (function () {
  try {
    const raw = store(FS_KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.type === 'dir') return o; }
  } catch (e) {}
  return defaultFS();
})();

function fsSave() { store(FS_KEY, JSON.stringify(fsRoot)); fsListeners.forEach(fn => fn()); }
const fsUsed = () => JSON.stringify(fsRoot).length;

function normPath(p, cwd = '/') {
  const out = [];
  for (const s of (p.startsWith('/') ? p : cwd + '/' + p).split('/')) {
    if (!s || s === '.') continue;
    if (s === '..') out.pop(); else out.push(s);
  }
  return '/' + out.join('/');
}
function fsGet(path) {
  let n = fsRoot;
  for (const s of path.split('/').filter(Boolean)) {
    if (n.type !== 'dir' || !Object.prototype.hasOwnProperty.call(n.children, s)) return null;
    n = n.children[s];
  }
  return n;
}
function fsSplit(path) { const i = path.lastIndexOf('/'); return [path.slice(0, i) || '/', path.slice(i + 1)]; }
function fsParentDir(path) {
  const [dp, name] = fsSplit(path);
  if (!name) throw new Error('Invalid path');
  const d = fsGet(dp);
  if (!d || d.type !== 'dir') throw new Error('No such directory: ' + dp);
  return [d, name];
}
function fsWrite(path, content) {
  const [d, name] = fsParentDir(path);
  if (d.children[name] && d.children[name].type === 'dir') throw new Error(name + ' is a directory');
  d.children[name] = { type: 'file', content };
  fsSave();
}
function fsMkdir(path) {
  const [d, name] = fsParentDir(path);
  if (d.children[name]) throw new Error(name + ' already exists');
  d.children[name] = { type: 'dir', children: {} };
  fsSave();
}
function fsRemove(path) {
  if (path === '/') throw new Error('Cannot remove the root directory');
  const [d, name] = fsParentDir(path);
  if (!d.children[name]) throw new Error('No such file or directory: ' + path);
  delete d.children[name];
  fsSave();
}
function fsUnique(dirNode, name) {
  if (!dirNode.children[name]) return name;
  const dot = name.lastIndexOf('.');
  const base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
  let i = 2;
  while (dirNode.children[base + ' (' + i + ')' + ext]) i++;
  return base + ' (' + i + ')' + ext;
}
function fsTarget(src, dst) {
  const dn = fsGet(dst);
  return dn && dn.type === 'dir' ? normPath(fsSplit(src)[1], dst) : dst;
}
function fsMove(src, dst) {
  src = normPath(src); dst = normPath(dst);
  if (src === '/') throw new Error('Cannot move the root directory');
  const node = fsGet(src);
  if (!node) throw new Error('No such file or directory: ' + src);
  const target = fsTarget(src, dst);
  if (target === src) return;
  if (target.startsWith(src + '/')) throw new Error('Cannot move a folder into itself');
  const [td, tname] = fsParentDir(target);
  if (td.children[tname]) throw new Error(tname + ' already exists');
  const [sd, sname] = fsParentDir(src);
  td.children[tname] = node;
  delete sd.children[sname];
  fsSave();
}
function fsCopy(src, dst) {
  src = normPath(src); dst = normPath(dst);
  const node = fsGet(src);
  if (!node) throw new Error('No such file or directory: ' + src);
  const target = fsTarget(src, dst);
  if (target === src || target.startsWith(src + '/')) throw new Error('Cannot copy onto itself');
  const [td, tname] = fsParentDir(target);
  if (td.children[tname]) throw new Error(tname + ' already exists');
  td.children[tname] = JSON.parse(JSON.stringify(node));
  fsSave();
}
function fsTrash(path) {
  if (path === '/Trash' || path === '/') throw new Error('Cannot delete this folder');
  const [d, name] = fsParentDir(path);
  const node = d.children[name];
  if (!node) throw new Error('No such file or directory: ' + path);
  if (!fsGet('/Trash')) fsRoot.children.Trash = { type: 'dir', children: {} };
  const trash = fsGet('/Trash');
  trash.children[fsUnique(trash, name)] = node;
  delete d.children[name];
  fsSave();
}

const appById = (id) => apps.find(a => a.id === id);
function openPath(p) {
  const n = fsGet(p);
  if (!n) return;
  launch(appById(n.type === 'dir' ? 'files' : 'notepad'), p);
}

/* ---- Files ---- */
function filesApp(body, win, startPath) {
  body.innerHTML = `
    <div class="fm">
      <div class="fm-bar">
        <button class="back" title="Back">←</button><button class="up" title="Up">↑</button>
        <div class="fm-path"></div>
        <button class="mkdir">New folder</button><button class="mkfile">New file</button>
        <button class="rename">Rename</button><button class="del">Delete</button>
        <button class="empty" style="display:none">Empty Trash</button>
      </div>
      <div class="fm-main"><div class="fm-side"></div><div class="fm-list"></div></div>
    </div>`;

  const listEl = $('.fm-list', body), pathEl = $('.fm-path', body), sideEl = $('.fm-side', body);
  const backStack = [];
  let cwd = '/', sel = null, lastTap = 0;
  const inTrash = (p) => p === '/Trash' || p.startsWith('/Trash/');

  [['🏠', 'Home', '/'], ['📄', 'Documents', '/Documents'], ['⬇️', 'Downloads', '/Downloads'],
   ['🖼️', 'Pictures', '/Pictures'], ['🗑️', 'Trash', '/Trash']].forEach(([icon, name, p]) => {
    const d = document.createElement('div');
    d.textContent = icon + ' ' + name;
    d.addEventListener('click', () => navigate(p));
    sideEl.appendChild(d);
  });

  function navigate(p, push = true) {
    const n = fsGet(p);
    if (!n || n.type !== 'dir') { osAlert('Files', 'Folder not found: ' + p); return; }
    if (push && p !== cwd) backStack.push(cwd);
    cwd = p; sel = null; render();
  }

  function openItem(name) {
    const p = normPath(name, cwd), n = fsGet(p);
    if (!n) return;
    if (n.type === 'dir') navigate(p); else launch(appById('notepad'), p);
  }

  function render() {
    let dir = fsGet(cwd);
    if (!dir || dir.type !== 'dir') { cwd = '/'; dir = fsRoot; }
    pathEl.textContent = cwd;
    win.setTitle('Files - ' + (cwd === '/' ? 'Home' : fsSplit(cwd)[1]));
    $('.back', body).disabled = !backStack.length;
    $('.up', body).disabled = cwd === '/';
    $('.empty', body).style.display = cwd === '/Trash' ? '' : 'none';
    if (sel && !dir.children[sel]) sel = null;

    const names = Object.keys(dir.children).sort((a, b) => {
      const da = dir.children[a].type === 'dir', db = dir.children[b].type === 'dir';
      return da !== db ? (da ? -1 : 1) : a.localeCompare(b);
    });
    listEl.innerHTML = '';
    if (!names.length) {
      const e = document.createElement('div');
      e.className = 'fm-empty';
      e.textContent = 'This folder is empty';
      listEl.appendChild(e);
    }
    names.forEach(name => {
      const node = dir.children[name];
      const row = document.createElement('div');
      row.className = 'fm-row' + (name === sel ? ' sel' : '');
      row.innerHTML = '<span></span><span class="nm"></span><span class="sz"></span>';
      row.children[0].textContent = node.type === 'dir' ? '📁' : '📄';
      row.children[1].textContent = name;
      row.children[2].textContent = node.type === 'dir' ? Object.keys(node.children).length + ' items' : node.content.length + ' B';
      row.addEventListener('click', () => {
        const now = Date.now();
        if (sel === name && now - lastTap < 500) { lastTap = 0; openItem(name); return; }
        lastTap = now;
        sel = name;
        listEl.querySelectorAll('.fm-row.sel').forEach(r => r.classList.remove('sel'));
        row.classList.add('sel');
      });
      listEl.appendChild(row);
    });
  }

  $('.back', body).addEventListener('click', () => { if (backStack.length) navigate(backStack.pop(), false); });
  $('.up', body).addEventListener('click', () => navigate(fsSplit(cwd)[0]));

  $('.mkdir', body).addEventListener('click', async () => {
    const name = await osPrompt('New folder', 'Folder name:', 'New folder');
    if (!name || !name.trim()) return;
    try { fsMkdir(normPath(name.trim(), cwd)); } catch (e) { osAlert('Error', e.message); }
  });
  $('.mkfile', body).addEventListener('click', async () => {
    const name = await osPrompt('New file', 'File name:', 'new.txt');
    if (!name || !name.trim()) return;
    try {
      const p = normPath(name.trim(), cwd);
      if (fsGet(p)) throw new Error('"' + name + '" already exists');
      fsWrite(p, '');
    } catch (e) { osAlert('Error', e.message); }
  });
  $('.rename', body).addEventListener('click', async () => {
    if (!sel) { notify('Rename', 'Select an item first'); return; }
    const newName = await osPrompt('Rename', 'New name:', sel);
    if (!newName || !newName.trim() || newName === sel) return;
    try {
      const np = normPath(newName.trim(), cwd);
      if (fsGet(np)) throw new Error('"' + newName + '" already exists');
      fsMove(normPath(sel, cwd), np);
    } catch (e) { osAlert('Error', e.message); }
  });
  $('.del', body).addEventListener('click', async () => {
    if (!sel) { notify('Delete', 'Select an item first'); return; }
    const p = normPath(sel, cwd), name = sel;
    try {
      if (inTrash(cwd)) {
        if (await osConfirm('Delete permanently', 'Permanently delete "' + name + '"?')) fsRemove(p);
      } else {
        fsTrash(p);
        notify('Moved to Trash', name);
      }
    } catch (e) { osAlert('Error', e.message); }
  });
  $('.empty', body).addEventListener('click', async () => {
    if (await osConfirm('Empty Trash', 'Permanently delete everything in the Trash?')) {
      fsGet('/Trash').children = {};
      fsSave();
    }
  });

  const onFs = () => render();
  fsListeners.add(onFs);
  win.onClose = () => fsListeners.delete(onFs);

  navigate(startPath || '/', false);
}

/* ---- Terminal ---- */
function terminalApp(body, win) {
  body.innerHTML = `
    <div class="term">
      <div class="out"></div>
      <div class="row"><span class="prompt"></span><input type="text" spellcheck="false" autocapitalize="off" autocomplete="off"></div>
    </div>`;

  const term = $('.term', body), out = $('.out', body), input = $('input', body), promptEl = $('.prompt', body);
  let cwd = '/', hist = [], hi = 0;

  const print = (text, cls) => {
    const d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text;
    out.appendChild(d);
    term.scrollTop = term.scrollHeight;
  };
  const setPrompt = () => { promptEl.textContent = 'user@webos:' + (cwd === '/' ? '~' : cwd) + '$'; };

  function tokenize(s) {
    const t = [], re = /"([^"]*)"|'([^']*)'|(\S+)/g;
    let m;
    while ((m = re.exec(s))) t.push(m[1] !== undefined ? m[1] : m[2] !== undefined ? m[2] : m[3]);
    return t;
  }
  const need = (args, n, usage) => { if (args.length < n) throw new Error('usage: ' + usage); };

  const cmds = {
    help() {
      return [
        'Commands:',
        '  ls [path]            list files',
        '  cd <path>            change directory',
        '  pwd                  print current directory',
        '  cat <file>           show a file',
        '  echo <text>          print text (use > file or >> file to save it)',
        '  mkdir <dir>          make a folder',
        '  touch <file>         create an empty file',
        '  rm [-r] <path>       delete permanently',
        '  mv <from> <to>       move or rename',
        '  cp <from> <to>       copy',
        '  open <app|file>      open an app or a file (try: open notepad)',
        '  apps                 list apps',
        '  ps / kill <pid>      list or end running windows',
        '  date, uptime, whoami, uname, neofetch, history, clear',
        '  lock, reboot, shutdown',
        'Tip: Tab completes names, Up/Down browse history.'
      ].join('\n');
    },
    ls(args) {
      const path = normPath(args.find(a => !a.startsWith('-')) || '.', cwd), n = fsGet(path);
      if (!n) throw new Error('ls: no such file or directory: ' + path);
      if (n.type === 'file') return fsSplit(path)[1];
      return Object.keys(n.children).sort().map(k => n.children[k].type === 'dir' ? k + '/' : k).join('  ');
    },
    cd(args) {
      const p = normPath(args[0] || '/', cwd), n = fsGet(p);
      if (!n || n.type !== 'dir') throw new Error('cd: not a directory: ' + (args[0] || '/'));
      cwd = p; setPrompt();
    },
    pwd() { return cwd; },
    cat(args) {
      need(args, 1, 'cat <file>');
      return args.map(a => {
        const n = fsGet(normPath(a, cwd));
        if (!n) throw new Error('cat: no such file: ' + a);
        if (n.type !== 'file') throw new Error('cat: ' + a + ': is a directory');
        return n.content;
      }).join('\n').replace(/\n$/, '');
    },
    echo(args) { return args.join(' '); },
    mkdir(args) { need(args, 1, 'mkdir <dir>'); args.forEach(a => fsMkdir(normPath(a, cwd))); },
    touch(args) {
      need(args, 1, 'touch <file>');
      args.forEach(a => { const p = normPath(a, cwd); if (!fsGet(p)) fsWrite(p, ''); });
    },
    rm(args) {
      const rec = args.some(a => /^-.*r/i.test(a));
      const targets = args.filter(a => !a.startsWith('-'));
      need(targets, 1, 'rm [-r] <path>');
      targets.forEach(a => {
        const p = normPath(a, cwd), n = fsGet(p);
        if (!n) throw new Error('rm: no such file or directory: ' + a);
        if (n.type === 'dir' && !rec) throw new Error('rm: ' + a + ' is a directory (use -r)');
        fsRemove(p);
      });
      if (!fsGet(cwd)) { cwd = '/'; setPrompt(); }
    },
    mv(args) { need(args, 2, 'mv <from> <to>'); fsMove(normPath(args[0], cwd), normPath(args[1], cwd)); },
    cp(args) { need(args, 2, 'cp <from> <to>'); fsCopy(normPath(args[0], cwd), normPath(args[1], cwd)); },
    clear() { out.innerHTML = ''; },
    date() { return new Date().toString(); },
    whoami() { return 'user'; },
    hostname() { return 'webos'; },
    uname() { return 'WebOS 0.2 (browser)'; },
    uptime() {
      const s = Math.floor((Date.now() - bootTime) / 1000);
      return 'up ' + Math.floor(s / 60) + ' min, ' + (s % 60) + ' sec';
    },
    history() { return hist.map((h, i) => (i + 1) + '  ' + h).join('\n'); },
    ps() {
      const lines = ['PID  STATE      NAME'];
      allWins.forEach(w => lines.push(String(w.id).padEnd(5) + (w.el.classList.contains('hidden') ? 'minimized' : 'running').padEnd(11) + w.name));
      return lines.join('\n');
    },
    kill(args) {
      need(args, 1, 'kill <pid>');
      const w = allWins.get(parseInt(args[0], 10));
      if (!w) throw new Error('kill: no such process: ' + args[0]);
      const name = w.name;
      w.close();
      return 'Terminated ' + name;
    },
    open(args) {
      need(args, 1, 'open <app or file>');
      const q = args.join(' '), ql = q.toLowerCase();
      const app = apps.find(a => a.id === ql || a.name.toLowerCase() === ql);
      if (app) { launch(app); return 'Opening ' + app.name; }
      const p = normPath(q, cwd);
      if (fsGet(p)) { openPath(p); return 'Opening ' + p; }
      throw new Error('open: not found: ' + q);
    },
    apps() { return apps.map(a => a.id).join('  '); },
    lock() { lockScreen(); },
    reboot() { restartOS(); },
    shutdown() { shutDownOS(); },
    neofetch() {
      const up = Math.floor((Date.now() - bootTime) / 1000);
      return [
        '  user@webos', '  ----------', '  OS:       WebOS 0.2', '  Kernel:   JavaScript',
        '  Uptime:   ' + Math.floor(up / 60) + 'm ' + (up % 60) + 's',
        '  Windows:  ' + allWins.size,
        '  Storage:  ' + (fsUsed() / 1024).toFixed(1) + ' KB',
        '  Screen:   ' + innerWidth + 'x' + innerHeight
      ].join('\n');
    }
  };

  function run(line) {
    print(promptEl.textContent + ' ' + line, 'pl');
    if (!line.trim()) return;
    hist.push(line); hi = hist.length;

    let tokens = tokenize(line), redirect = null, append = false;
    const ri = tokens.findIndex(t => t === '>' || t === '>>');
    if (ri !== -1) {
      append = tokens[ri] === '>>';
      redirect = tokens[ri + 1];
      tokens = tokens.slice(0, ri);
      if (!redirect) { print('syntax error: missing file after redirect', 'err'); return; }
    }
    const name = tokens[0], args = tokens.slice(1);
    if (!name) return;
    if (!Object.prototype.hasOwnProperty.call(cmds, name)) { print(name + ': command not found', 'err'); return; }
    try {
      const res = cmds[name](args);
      const text = res === undefined ? '' : String(res);
      if (redirect) {
        const p = normPath(redirect, cwd), ex = fsGet(p);
        const prev = append && ex && ex.type === 'file' ? ex.content : '';
        fsWrite(p, prev + (text ? text + '\n' : ''));
      } else if (text) {
        print(text);
      }
    } catch (e) { print(e.message, 'err'); }
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const v = input.value; input.value = '';
      run(v);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (hi > 0) { hi--; input.value = hist[hi]; }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (hi < hist.length - 1) { hi++; input.value = hist[hi]; } else { hi = hist.length; input.value = ''; }
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const v = input.value, sp = v.lastIndexOf(' '), head = v.slice(0, sp + 1), word = v.slice(sp + 1);
      let options;
      if (sp === -1) {
        options = Object.keys(cmds).filter(c => c.startsWith(word));
      } else {
        const slash = word.lastIndexOf('/'), dirPart = word.slice(0, slash + 1), base = word.slice(slash + 1);
        const d = fsGet(normPath(dirPart || '.', cwd));
        options = d && d.type === 'dir'
          ? Object.keys(d.children).filter(k => k.startsWith(base)).map(k => dirPart + k + (d.children[k].type === 'dir' ? '/' : ''))
          : [];
      }
      if (options.length === 1) input.value = head + options[0] + (sp === -1 ? ' ' : '');
      else if (options.length > 1) print(options.join('  '));
    }
  });

  term.addEventListener('click', () => { if (!String(window.getSelection())) input.focus(); });
  print('WebOS Terminal. Type "help" for a list of commands.');
  setPrompt();
  setTimeout(() => input.focus(), 0);
}

/* ---- Task Manager ---- */
function taskManagerApp(body, win) {
  body.innerHTML = `
    <div class="tm">
      <div class="tm-sum"></div>
      <div class="tm-list"><table>
        <thead><tr><th>PID</th><th>Name</th><th>Status</th><th>Running</th><th></th></tr></thead>
        <tbody></tbody>
      </table></div>
    </div>`;
  const sum = $('.tm-sum', body), tbody = $('tbody', body);
  const rows = new Map();
  const fmtDur = (s) => s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + (s % 60) + 's';

  function update() {
    const up = Math.floor((Date.now() - bootTime) / 1000);
    let mem = '';
    if (window.performance && performance.memory) mem = ' · Memory: ' + Math.round(performance.memory.usedJSHeapSize / 1048576) + ' MB';
    sum.textContent = 'Uptime: ' + fmtDur(up) + ' · Windows: ' + allWins.size + ' · Storage: ' + (fsUsed() / 1024).toFixed(1) + ' KB' + mem;

    for (const [id, r] of rows) if (!allWins.has(id)) { r.tr.remove(); rows.delete(id); }
    allWins.forEach(w => {
      let r = rows.get(w.id);
      if (!r) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td></td><td></td><td></td><td></td><td><button>End task</button></td>';
        tr.children[0].textContent = w.id;
        tr.children[1].textContent = w.icon + ' ' + w.name;
        $('button', tr).addEventListener('click', () => { w.close(); update(); });
        tbody.appendChild(tr);
        r = { tr, status: tr.children[2], run: tr.children[3] };
        rows.set(w.id, r);
      }
      r.status.textContent = w.el.classList.contains('hidden') ? 'Minimized' : 'Running';
      r.run.textContent = fmtDur(Math.floor((Date.now() - w.started) / 1000));
    });
  }
  update();
  const timer = setInterval(update, 1000);
  win.onClose = () => clearInterval(timer);
}

/* =========================================================
   OS state: boot, lock screen, power, tray, context menu
   ========================================================= */
let bootTime = Date.now();
const bootEl = $('#boot'), lockEl = $('#lock'), offEl = $('#off');
const lockPw = $('#lock-pw'), lockHint = $('#lock-hint');

function pwHash(s) {
  let h = 5381;
  for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0;
  return 'h' + h;
}
const hasPassword = () => !!store('pw');
const isLocked = () => document.body.classList.contains('locked');

function closeAllWindows() { [...allWins.values()].forEach(w => w.close()); if (typeof mpLeave === 'function') mpLeave(); }

function tickLock() {
  const n = new Date();
  $('.lock-time').textContent = n.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('.lock-date').textContent = n.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
setInterval(tickLock, 1000);

function lockScreen() {
  $('#start-menu').classList.remove('open');
  lockEl.style.background = getComputedStyle(desktop).backgroundImage;
  tickLock();
  lockPw.value = '';
  lockPw.style.display = hasPassword() ? 'block' : 'none';
  lockHint.textContent = hasPassword() ? 'Enter your password' : 'Click to unlock';
  lockEl.classList.remove('hide');
  document.body.classList.add('locked');
  if (hasPassword()) setTimeout(() => lockPw.focus(), 50);
}
function unlock() {
  lockEl.classList.add('hide');
  document.body.classList.remove('locked');
}
lockEl.addEventListener('click', (e) => {
  if (e.target === lockPw) return;
  if (hasPassword()) lockPw.focus(); else unlock();
});
lockPw.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (pwHash(lockPw.value) === store('pw')) unlock();
  else { lockHint.textContent = 'Wrong password, try again'; lockPw.value = ''; }
});
document.addEventListener('keydown', () => { if (isLocked() && !hasPassword()) unlock(); });

function bootSequence() {
  closeAllWindows();
  offEl.classList.remove('on');
  lockEl.classList.add('hide');
  document.body.classList.remove('locked');
  bootEl.classList.remove('gone');
  const fill = $('.boot-fill');
  fill.style.animation = 'none';
  void fill.offsetWidth;
  fill.style.animation = 'bootfill 2s ease-in-out forwards';
  setTimeout(() => {
    bootEl.classList.add('gone');
    bootTime = Date.now();
    lockScreen();
  }, 2100);
}
function restartOS() { bootSequence(); }
function shutDownOS() {
  closeAllWindows();
  $('#start-menu').classList.remove('open');
  offEl.classList.add('on');
}
offEl.addEventListener('click', bootSequence);

/* ---- Tray ---- */
(function () {
  const tray = $('#tray');
  const wifi = document.createElement('span'), bat = document.createElement('span');
  tray.append(wifi, bat);
  const updNet = () => { wifi.textContent = navigator.onLine ? '📶' : '🚫'; wifi.title = navigator.onLine ? 'Online' : 'Offline'; };
  updNet();
  window.addEventListener('online', () => { updNet(); notify('Network', 'You are back online'); });
  window.addEventListener('offline', () => { updNet(); notify('Network', 'You are offline'); });
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      const upd = () => { bat.textContent = (b.charging ? '⚡' : '🔋') + ' ' + Math.round(b.level * 100) + '%'; bat.title = b.charging ? 'Charging' : 'On battery'; };
      upd();
      b.addEventListener('levelchange', upd);
      b.addEventListener('chargingchange', upd);
    }).catch(() => {});
  }
})();

/* ---- Desktop context menu ---- */
const ctxMenu = $('#ctx-menu');
function hideCtx() { ctxMenu.style.display = 'none'; }
function showCtx(x, y, items) {
  ctxMenu.innerHTML = '';
  items.forEach(([label, fn]) => {
    const d = document.createElement('div');
    d.className = 'ctx-item';
    d.textContent = label;
    d.addEventListener('click', () => { hideCtx(); fn(); });
    ctxMenu.appendChild(d);
  });
  ctxMenu.style.display = 'block';
  ctxMenu.style.left = Math.max(0, Math.min(x, innerWidth - ctxMenu.offsetWidth)) + 'px';
  ctxMenu.style.top = Math.max(0, Math.min(y, innerHeight - ctxMenu.offsetHeight - 48)) + 'px';
}
function nextWallpaper() {
  let i = parseInt(store('wallpaper'), 10);
  i = ((isNaN(i) ? 0 : i) + 1) % wallpapers.length;
  applyWallpaper(i);
  store('wallpaper', String(i));
}
desktop.addEventListener('contextmenu', (e) => {
  if (e.target !== desktop && e.target !== $('#icons')) return;
  e.preventDefault();
  showCtx(e.clientX, e.clientY, [
    ['📁 Files', () => launch(appById('files'))],
    ['💻 Terminal', () => launch(appById('terminal'))],
    ['📊 Task Manager', () => launch(appById('taskmgr'))],
    ['🖼️ Next wallpaper', nextWallpaper],
    ['⚙️ Settings', () => launch(appById('settings'))],
    ['🔒 Lock', lockScreen]
  ]);
});
document.addEventListener('click', hideCtx);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCtx(); });

const apps = [
  { id: 'files',    name: 'Files',    icon: '📁', width: 600, height: 420, build: (b, w, arg) => filesApp(b, w, arg || '/') },
  { id: 'terminal', name: 'Terminal', icon: '💻', width: 560, height: 360, build: terminalApp },
  { id: 'browser',    name: 'Browser',    icon: '🌐', width: 760, height: 520, build: browserApp },
  { id: 'notepad',    name: 'Notepad',    icon: '📝', width: 480, height: 360, build: notepadApp },
  { id: 'calculator', name: 'Calculator', icon: '🧮', width: 280, height: 410, build: calculatorApp },
  { id: 'taskmgr',    name: 'Task Manager', icon: '📊', width: 480, height: 320, build: taskManagerApp },
  { id: 'snake',      name: 'Snake',      icon: '🐍', width: 360, height: 500, build: snakeApp },
  { id: 'tictactoe',  name: 'Tic-Tac-Toe', icon: '❌', width: 340, height: 420, build: tictactoeApp },
  { id: 'minesweeper', name: 'Minesweeper', icon: '💣', width: 340, height: 420, build: minesweeperApp },
  { id: 'gloom',      name: 'Gloom',      icon: '👹', width: 640, height: 460, build: gloomApp },
  { id: 'youtube',    name: 'YouTube',    icon: '📺', width: 820, height: 520, build: youtubeApp },
  { id: 'multiplayer', name: 'Multiplayer', icon: '👥', width: 560, height: 580, build: multiplayerApp, single: true },
  { id: 'settings',   name: 'Settings',   icon: '⚙️', width: 440, height: 420, build: settingsApp },
  { id: 'trash',      name: 'Trash',      icon: '🗑️', width: 520, height: 360, build: (b, w) => filesApp(b, w, '/Trash') }
];

function launch(app, arg) {
  if (app.single) {
    const ex = [...allWins.values()].find(w => w.name === app.name);
    if (ex) { ex.el.classList.remove('hidden'); focusWindow(ex); return; }
  }
  createWindow({ title: app.name, icon: app.icon, width: app.width, height: app.height, build: app.build, arg });
}

const iconsEl = $('#icons');
const menuItemsEl = $('#menu-items');
const startMenu = $('#start-menu');

apps.forEach(app => {
  // Desktop icon (double-click, or single tap on touch devices)
  const ic = document.createElement('div');
  ic.className = 'icon';
  ic.innerHTML = `<div class="emoji">${app.icon}</div><div>${app.name}</div>`;
  ic.addEventListener('dblclick', () => launch(app));
  ic.addEventListener('pointerup', (e) => { if (e.pointerType === 'touch') launch(app); });
  iconsEl.appendChild(ic);

  // Start menu entry
  const mi = document.createElement('div');
  mi.className = 'menu-item';
  mi.innerHTML = `<span class="emoji">${app.icon}</span><span>${app.name}</span>`;
  mi.addEventListener('click', () => { launch(app); startMenu.classList.remove('open'); });
  menuItemsEl.appendChild(mi);
});

$('#start-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  startMenu.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!startMenu.contains(e.target)) startMenu.classList.remove('open');
});

/* =========================================================
   Wiring: start menu search, power buttons, icon menus, boot
   ========================================================= */
const menuSearch = $('#menu-search');
function filterMenu(q) {
  q = q.trim().toLowerCase();
  [...menuItemsEl.children].forEach(el => {
    el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}
menuSearch.addEventListener('input', () => filterMenu(menuSearch.value));
menuSearch.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const first = [...menuItemsEl.children].find(el => el.style.display !== 'none');
    if (first) first.click();
  }
  if (e.key === 'Escape') startMenu.classList.remove('open');
});
$('#start-btn').addEventListener('click', () => {
  if (startMenu.classList.contains('open')) {
    menuSearch.value = '';
    filterMenu('');
    menuSearch.focus();
  }
});
$('#btn-lock').addEventListener('click', lockScreen);
$('#btn-restart').addEventListener('click', restartOS);
$('#btn-shutdown').addEventListener('click', shutDownOS);

[...iconsEl.children].forEach((ic, i) => {
  ic.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    showCtx(e.clientX, e.clientY, [['Open', () => launch(apps[i])]]);
  });
});

bootSequence();
</script>
</body>
</html>
