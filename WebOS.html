<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebOS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  body.dragging iframe { pointer-events: none; }

  /* ---------- Desktop ---------- */
  #desktop {
    position: fixed;
    inset: 0 0 48px 0;
    background: linear-gradient(135deg, #1e3c72, #2a5298 50%, #6a85b6);
    background-size: cover;
  }

  #icons {
    position: absolute;
    inset: 0;
    padding: 10px;
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(auto-fill, 90px);
    grid-auto-columns: 90px;
    gap: 6px;
  }
  .icon {
    width: 90px; height: 90px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    border-radius: 8px;
    color: #fff;
    font-size: 12px;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    cursor: pointer;
    border: 1px solid transparent;
  }
  .icon:hover { background: rgba(255,255,255,.12); }
  .icon:active { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.3); }
  .icon .emoji { font-size: 34px; line-height: 1; }

  /* ---------- Windows ---------- */
  .win {
    position: absolute;
    min-width: 260px; min-height: 160px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.15);
    display: flex; flex-direction: column;
    overflow: hidden;
    resize: both;
  }
  .win.active { box-shadow: 0 14px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(59,130,246,.7); }
  .win.max { border-radius: 0; resize: none; }
  .win.hidden { display: none; }

  .titlebar {
    height: 36px; flex: none;
    display: flex; align-items: center;
    padding-left: 10px;
    background: #e5e7eb;
    cursor: default;
    touch-action: none;
  }
  .win.active .titlebar { background: #dbeafe; }
  .t-icon { margin-right: 6px; font-size: 15px; }
  .t-title { flex: 1; font-size: 13px; font-weight: 600; color: #1f2937; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-btns { display: flex; height: 100%; }
  .t-btns button {
    width: 42px; height: 100%;
    border: none; background: transparent;
    font-size: 13px; color: #374151; cursor: pointer;
  }
  .t-btns button:hover { background: rgba(0,0,0,.08); }
  .t-btns button.close:hover { background: #ef4444; color: #fff; }

  .win-body { flex: 1; min-height: 0; position: relative; background: #fff; overflow: hidden; }

  /* ---------- Taskbar ---------- */
  #taskbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 48px;
    background: rgba(20, 24, 33, 0.92);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px;
    border-top: 1px solid rgba(255,255,255,.08);
    z-index: 100000;
  }
  #start-btn {
    height: 36px; padding: 0 14px;
    border: none; border-radius: 6px;
    background: #3b82f6; color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    flex: none;
  }
  #start-btn:hover { background: #2f6fdb; }

  #tasks { flex: 1; display: flex; gap: 6px; overflow: hidden; }
  .task-btn {
    height: 36px; max-width: 170px; min-width: 60px;
    padding: 0 12px;
    border: none; border-radius: 6px;
    background: rgba(255,255,255,.08);
    color: #e5e7eb; font-size: 13px;
    cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-bottom: 2px solid transparent;
  }
  .task-btn:hover { background: rgba(255,255,255,.16); }
  .task-btn.active { background: rgba(255,255,255,.18); border-bottom-color: #60a5fa; }

  #clock { color: #e5e7eb; font-size: 13px; text-align: right; line-height: 1.25; padding: 0 10px; flex: none; }

  /* ---------- Start menu ---------- */
  #start-menu {
    position: fixed; left: 8px; bottom: 56px;
    width: 260px;
    background: rgba(20, 24, 33, 0.96);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: 10px;
    color: #e5e7eb;
    display: none;
    z-index: 100001;
  }
  #start-menu.open { display: block; }
  #start-menu h2 { font-size: 12px; color: #9ca3af; font-weight: 500; margin: 4px 6px 8px; }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px;
    font-size: 14px; cursor: pointer;
  }
  .menu-item:hover { background: rgba(255,255,255,.1); }
  .menu-item .emoji { font-size: 20px; }

  /* ---------- Browser app ---------- */
  .browser { display: flex; flex-direction: column; height: 100%; }
  .b-bar { display: flex; gap: 6px; padding: 6px; background: #f3f4f6; border-bottom: 1px solid #d1d5db; flex: none; }
  .b-bar button {
    width: 32px; height: 30px; border: none; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 14px; color: #374151;
    box-shadow: 0 0 0 1px #d1d5db inset;
  }
  .b-bar button:hover:not(:disabled) { background: #e5e7eb; }
  .b-bar button:disabled { opacity: .4; cursor: default; }
  .b-bar input {
    flex: 1; min-width: 0; height: 30px; padding: 0 12px;
    border: none; border-radius: 15px; outline: none;
    box-shadow: 0 0 0 1px #d1d5db inset;
    font-size: 13px; user-select: text;
  }
  .b-bar input:focus { box-shadow: 0 0 0 2px #3b82f6 inset; }
  .b-view { flex: 1; position: relative; min-height: 0; }
  .b-view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #fff; }
  .b-home {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: linear-gradient(160deg, #f8fafc, #e0e7ff);
    padding: 20px; text-align: center;
  }
  .b-home h1 { font-size: 26px; color: #1f2937; font-weight: 700; }
  .b-home .sites { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .b-home .site {
    padding: 10px 16px; border-radius: 8px; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.15); font-size: 14px; color: #1f2937; cursor: pointer;
  }
  .b-home .site:hover { background: #eff6ff; }
  .b-home small { color: #6b7280; max-width: 360px; line-height: 1.4; }

  /* ---------- Notepad ---------- */
  .notepad { width: 100%; height: 100%; display: block; border: none; outline: none; resize: none;
    padding: 12px; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; user-select: text; }

  /* ---------- Calculator ---------- */
  .calc { display: flex; flex-direction: column; height: 100%; background: #111827; padding: 10px; gap: 10px; }
  .calc-display {
    height: 70px; flex: none; display: flex; align-items: flex-end; justify-content: flex-end;
    padding: 6px 10px; color: #fff; font-size: 34px; overflow: hidden;
  }
  .calc-keys { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .calc-keys button {
    border: none; border-radius: 10px; font-size: 20px; cursor: pointer;
    background: #374151; color: #fff;
  }
  .calc-keys button:hover { filter: brightness(1.2); }
  .calc-keys button:active { filter: brightness(.9); }
  .calc-keys button.op { background: #f59e0b; }
  .calc-keys button.fn { background: #6b7280; }
  .calc-keys button.zero { grid-column: span 2; }

  /* ---------- Settings ---------- */
  .settings { padding: 18px; height: 100%; overflow: auto; }
  .settings h3 { font-size: 15px; color: #1f2937; margin-bottom: 12px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; }
  .swatch { width: 84px; height: 56px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .swatch.sel { border-color: #3b82f6; }

  /* ---------- Games (shared) ---------- */
  .game { display: flex; flex-direction: column; height: 100%; background: #111827; color: #e5e7eb; }
  .g-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; font-size: 14px; flex: none; }
  .g-btn { border: none; border-radius: 6px; padding: 6px 12px; background: #3b82f6; color: #fff; font-size: 13px; cursor: pointer; }
  .g-btn:hover { background: #2f6fdb; }
  .g-top select { height: 30px; border-radius: 6px; border: none; padding: 0 8px; background: #374151; color: #fff; font-size: 13px; }

  /* Snake */
  .game canvas { flex: 1; min-height: 0; width: 100%; object-fit: contain; display: block; }
  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 40px); gap: 4px; justify-content: center; padding: 6px; flex: none; }
  .dpad button { border: none; border-radius: 8px; background: #374151; color: #fff; font-size: 16px; cursor: pointer; touch-action: manipulation; }
  .dpad button:active { background: #4b5563; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }

  /* Tic-Tac-Toe */
  .ttt-status { text-align: center; padding: 4px; font-size: 15px; flex: none; }
  .ttt-board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; padding: 12px; }
  .ttt-cell { border: none; border-radius: 10px; background: #1f2937; font-size: 44px; font-weight: 700; cursor: pointer; color: #fff; }
  .ttt-cell:hover:not(:disabled) { background: #374151; }
  .ttt-cell.X { color: #60a5fa; }
  .ttt-cell.O { color: #f87171; }
  .ttt-cell.win { background: #166534; }

  /* Minesweeper */
  .mgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); gap: 2px; padding: 8px; }
  .mcell { border: none; border-radius: 4px; background: #4b5563; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; padding: 0; touch-action: manipulation; }
  .mcell:hover:not(.open) { background: #6b7280; }
  .mcell.open { background: #1f2937; cursor: default; }
  .mcell.boom { background: #991b1b; }

  /* ---------- System UI ---------- */
  #menu-search { width: 100%; height: 34px; border: none; border-radius: 6px; padding: 0 10px; margin-bottom: 8px; background: rgba(255,255,255,.1); color: #fff; font-size: 14px; outline: none; user-select: text; }
  #menu-search::placeholder { color: #9ca3af; }
  #menu-items { max-height: 340px; overflow-y: auto; }
  .menu-power { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.1); font-size: 13px; color: #9ca3af; }
  .pw-btn { border: none; background: transparent; color: #e5e7eb; font-size: 16px; width: 34px; height: 30px; border-radius: 6px; cursor: pointer; }
  .pw-btn:hover { background: rgba(255,255,255,.12); }

  #tray { display: flex; align-items: center; gap: 10px; color: #e5e7eb; font-size: 13px; padding: 0 6px; flex: none; }
  #tray span { cursor: default; }

  #ctx-menu { position: fixed; display: none; min-width: 190px; padding: 5px; background: rgba(20,24,33,.97); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.4); z-index: 150000; }
  .ctx-item { padding: 8px 12px; border-radius: 5px; color: #e5e7eb; font-size: 13px; cursor: pointer; }
  .ctx-item:hover { background: rgba(255,255,255,.12); }

  #toasts { position: fixed; right: 12px; bottom: 60px; display: flex; flex-direction: column; gap: 8px; z-index: 120000; pointer-events: none; }
  .toast { background: rgba(20,24,33,.96); color: #e5e7eb; padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.4); font-size: 13px; max-width: 280px; }
  .toast b { display: block; margin-bottom: 2px; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 200000; }
  .dlg { width: min(340px, 90vw); background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .dlg-t { font-weight: 700; margin-bottom: 6px; color: #111827; }
  .dlg-m { font-size: 14px; color: #374151; margin-bottom: 10px; white-space: pre-wrap; }
  .dlg-m:empty { display: none; }
  .dlg-in { width: 100%; height: 34px; border: 1px solid #d1d5db; border-radius: 6px; padding: 0 10px; font-size: 14px; margin-bottom: 12px; user-select: text; }
  .dlg-b { display: flex; justify-content: flex-end; gap: 8px; }
  .g-btn.secondary { background: #e5e7eb; color: #111827; }
  .g-btn.secondary:hover { background: #d1d5db; }

  /* Lock, boot, power-off */
  #lock { position: fixed; inset: 0; z-index: 250000; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12vh 20px 10vh; color: #fff; background: #1e3c72; background-size: cover; text-shadow: 0 1px 6px rgba(0,0,0,.4); transition: opacity .4s, visibility 0s; }
  #lock.hide { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .4s, visibility 0s .4s; }
  .lock-time { font-size: 72px; font-weight: 300; text-align: center; }
  .lock-date { font-size: 18px; text-align: center; opacity: .9; }
  .lock-login { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 36px; }
  #lock-pw { display: none; width: 220px; height: 38px; border-radius: 19px; border: none; padding: 0 16px; text-align: center; outline: none; font-size: 15px; user-select: text; }
  #lock-hint { font-size: 13px; opacity: .9; min-height: 18px; }

  #boot { position: fixed; inset: 0; z-index: 300000; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #boot.gone { display: none; }
  .boot-logo { font-size: 64px; }
  .boot-name { font-size: 22px; letter-spacing: 4px; font-weight: 300; }
  .boot-bar { width: 180px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; margin-top: 12px; }
  .boot-fill { height: 100%; width: 0; background: #60a5fa; }
  @keyframes bootfill { from { width: 0; } to { width: 100%; } }

  #off { position: fixed; inset: 0; z-index: 310000; background: #000; color: #9ca3af; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-size: 18px; }
  #off.on { display: flex; }

  /* ---------- Files ---------- */
  .fm { display: flex; flex-direction: column; height: 100%; background: #fff; color: #111827; font-size: 13px; }
  .fm-bar { display: flex; gap: 6px; padding: 6px; background: #f3f4f6; border-bottom: 1px solid #d1d5db; flex: none; flex-wrap: wrap; align-items: center; }
  .fm-bar button { height: 28px; padding: 0 10px; border: none; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px #d1d5db inset; cursor: pointer; font-size: 13px; color: #374151; }
  .fm-bar button:hover:not(:disabled) { background: #e5e7eb; }
  .fm-bar button:disabled { opacity: .4; cursor: default; }
  .fm-path { flex: 1; min-width: 100px; height: 28px; line-height: 28px; padding: 0 10px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px #d1d5db inset; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .fm-main { flex: 1; min-height: 0; display: flex; }
  .fm-side { width: 120px; flex: none; background: #f9fafb; border-right: 1px solid #e5e7eb; padding: 6px; overflow-y: auto; }
  .fm-side div { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .fm-side div:hover { background: #e5e7eb; }
  .fm-list { flex: 1; min-width: 0; overflow: auto; }
  .fm-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: default; border-bottom: 1px solid #f3f4f6; }
  .fm-row:hover { background: #f3f4f6; }
  .fm-row.sel { background: #dbeafe; }
  .fm-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fm-row .sz { color: #6b7280; width: 70px; text-align: right; flex: none; }
  .fm-empty { padding: 30px; text-align: center; color: #9ca3af; }

  /* ---------- Notepad (with files) ---------- */
  .np { display: flex; flex-direction: column; height: 100%; }
  .np .notepad { height: auto; flex: 1; min-height: 0; }
  .np-status { padding: 4px 10px; font-size: 12px; color: #6b7280; background: #f3f4f6; border-top: 1px solid #d1d5db; flex: none; }

  /* ---------- Terminal ---------- */
  .term { height: 100%; background: #0b1020; color: #d1d5db; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 8px; overflow-y: auto; user-select: text; cursor: text; }
  .term .line { white-space: pre-wrap; word-break: break-word; }
  .term .err { color: #f87171; }
  .term .prompt, .term .pl { color: #4ade80; }
  .term .row { display: flex; gap: 6px; }
  .term input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #fff; font: inherit; padding: 0; }

  /* ---------- Task Manager ---------- */
  .tm { height: 100%; display: flex; flex-direction: column; background: #fff; color: #111827; font-size: 13px; }
  .tm-sum { padding: 10px 12px; background: #f3f4f6; border-bottom: 1px solid #d1d5db; flex: none; }
  .tm-list { flex: 1; overflow: auto; }
  .tm table { width: 100%; border-collapse: collapse; }
  .tm th, .tm td { text-align: left; padding: 7px 12px; border-bottom: 1px solid #f3f4f6; }
  .tm th { position: sticky; top: 0; background: #fff; color: #6b7280; font-weight: 600; }
  .tm td button { border: none; border-radius: 6px; background: #ef4444; color: #fff; padding: 4px 10px; cursor: pointer; font-size: 12px; }

  /* ---------- Gloom (FPS) ---------- */
  .fps-wrap { position: relative; flex: 1; min-height: 0; background: #000; }
  .fps-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; touch-action: none; outline: none; cursor: crosshair; }
  .fps-touch { position: absolute; inset: 0; pointer-events: none; }
  .fps-touch button { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; border: 1px solid rgba(255,255,255,.4); border-radius: 12px; background: rgba(255,255,255,.18); color: #fff; font-size: 18px; cursor: pointer; }
  .fps-touch button:active { background: rgba(255,255,255,.38); }
  .fps-move { position: absolute; left: 10px; bottom: 30px; display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); gap: 5px; }
  .fps-move [data-k="fwd"] { grid-column: 2; grid-row: 1; }
  .fps-move [data-k="sl"] { grid-column: 1; grid-row: 2; }
  .fps-move [data-k="back"] { grid-column: 2; grid-row: 2; }
  .fps-move [data-k="sr"] { grid-column: 3; grid-row: 2; }
  .fps-act { position: absolute; right: 10px; bottom: 30px; display: grid; grid-template-columns: 54px 54px; grid-template-rows: 50px 62px; gap: 5px; }
  .fps-act .fire { grid-column: 1 / span 2; grid-row: 2; background: rgba(220,38,38,.55); font-weight: 700; letter-spacing: 1px; }
  @media (hover: hover) and (pointer: fine) { .fps-touch { display: none; } }

  /* ---------- YouTube ---------- */
  .yt { container-type: inline-size; display: flex; flex-direction: column; height: 100%; background: #0f0f0f; color: #f1f1f1; font-size: 13px; }
  .yt-bar { display: flex; gap: 6px; padding: 8px; background: #181818; border-bottom: 1px solid #2a2a2a; flex: none; }
  .yt-bar input { flex: 1; min-width: 0; height: 34px; padding: 0 14px; border: 1px solid #303030; border-radius: 17px; background: #121212; color: #fff; outline: none; font-size: 13px; user-select: text; }
  .yt-bar input:focus { border-color: #3ea6ff; }
  .yt-bar button { height: 34px; min-width: 38px; padding: 0 12px; border: none; border-radius: 17px; background: #272727; color: #f1f1f1; cursor: pointer; font-size: 14px; }
  .yt-bar button:hover { background: #3a3a3a; }
  .yt-bar .yt-go { background: #3ea6ff; color: #06121f; font-weight: 600; }
  .yt-bar .yt-go:hover { background: #65b8ff; }
  .yt-main { flex: 1; min-height: 0; display: flex; }
  .yt-player { flex: 1; min-width: 0; min-height: 0; position: relative; background: #000; }
  .yt-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #000; }
  .yt-home { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 20px; color: #aaa; line-height: 1.45; }
  .yt-home .big { width: 84px; height: 84px; border-radius: 50%; background: #272727; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #f1f1f1; padding-left: 6px; }
  .yt-side { width: 270px; flex: none; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid #2a2a2a; background: #0f0f0f; }
  .yt-tabs { display: flex; gap: 4px; padding: 6px; flex: none; align-items: center; }
  .yt-tabs button { border: none; background: transparent; color: #aaa; padding: 6px 12px; border-radius: 14px; cursor: pointer; font-size: 13px; }
  .yt-tabs button:hover { background: #272727; }

<body>

<script>
/* =========================================================
   Helpers
   ========================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const desktop = $('#desktop');

function store(key, value) {
  try {
    if (value === undefined) return localStorage.getItem('webos.' + key);
    localStorage.setItem('webos.' + key, value);
  } catch (e) { return null; }
}

/* =========================================================
   Clock
   ========================================================= */
const clock = $('#clock');
function updateClock() {
  const now = new Date();
  clock.innerHTML =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) +
    '<br>' +
    now.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
}
updateClock();
setInterval(updateClock, 1000);

/* =========================================================
   Window manager
   ========================================================= */
const allWins = new Map();
let winSeq = 0;
let zTop = 10;
let openCount = 0;
let activeWin = null;
const tasksEl = $('#tasks');

function focusWindow(w) {
  if (activeWin && activeWin !== w) {
    activeWin.el.classList.remove('active');
    activeWin.btn.classList.remove('active');
  }
  activeWin = w;
  w.el.style.zIndex = ++zTop;
  w.el.classList.add('active');
  w.btn.classList.add('active');
}

function createWindow({ title, icon, width = 520, height = 380, build, arg }) {
  const el = document.createElement('div');
  el.className = 'win';
  el.innerHTML = `
    <div class="titlebar">
      <span class="t-icon">${icon}</span>
      <span class="t-title">${title}</span>
      <div class="t-btns">
        <button class="min" title="Minimize">&#8212;</button>
        <button class="maxb" title="Maximize">&#9633;</button>
        <button class="close" title="Close">&#10005;</button>
      </div>
    </div>
    <div class="win-body"></div>`;

  const dw = desktop.clientWidth, dh = desktop.clientHeight;
  width = Math.min(width, dw);
  height = Math.min(height, dh);
  const offset = (openCount++ % 8) * 28;
  el.style.width = width + 'px';
  el.style.height = height + 'px';
  el.style.left = Math.max(0, Math.min(90 + offset + 40, dw - width)) + 'px';
  el.style.top = Math.max(0, Math.min(30 + offset, dh - height)) + 'px';

  const btn = document.createElement('button');
  btn.className = 'task-btn';
  btn.textContent = icon + ' ' + title;

  const w = { el, btn, maximized: false, saved: null, id: ++winSeq, name: title, icon, started: Date.now() };
  w.setTitle = (t) => { $('.t-title', el).textContent = t; btn.textContent = icon + ' ' + t; };
  allWins.set(w.id, w);
  desktop.appendChild(el);
  tasksEl.appendChild(btn);

  const titlebar = $('.titlebar', el);
  const body = $('.win-body', el);

  // Focus on any press
  el.addEventListener('pointerdown', () => focusWindow(w));

  // Dragging
  titlebar.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.t-btns') || w.maximized) return;
    const startX = e.clientX, startY = e.clientY;
    const origL = el.offsetLeft, origT = el.offsetTop;
    document.body.classList.add('dragging');
    titlebar.setPointerCapture(e.pointerId);
    const move = (ev) => {
      el.style.left = (origL + ev.clientX - startX) + 'px';
      el.style.top = Math.max(0, origT + ev.clientY - startY) + 'px';
    };
    const up = () => {
      document.body.classList.remove('dragging');
      titlebar.removeEventListener('pointermove', move);
      titlebar.removeEventListener('pointerup', up);
    };
    titlebar.addEventListener('pointermove', move);
    titlebar.addEventListener('pointerup', up);
  });

  // Maximize / restore
  function toggleMax() {
    if (!w.maximized) {
      w.saved = { l: el.style.left, t: el.style.top, w: el.style.width, h: el.style.height };
      el.style.left = '0px'; el.style.top = '0px';
      el.style.width = '100%'; el.style.height = '100%';
      el.classList.add('max');
    } else {
      Object.assign(el.style, { left: w.saved.l, top: w.saved.t, width: w.saved.w, height: w.saved.h });
      el.classList.remove('max');
    }
    w.maximized = !w.maximized;
  }
  titlebar.addEventListener('dblclick', (e) => { if (!e.target.closest('.t-btns')) toggleMax(); });
  $('.maxb', el).addEventListener('click', toggleMax);

  // Minimize
  function minimize() {
    el.classList.add('hidden');
    btn.classList.remove('active');
    if (activeWin === w) activeWin = null;
  }
  $('.min', el).addEventListener('click', minimize);

  // Close
  function close() {
    el.remove(); btn.remove();
    if (activeWin === w) activeWin = null;
    if (w.onClose) w.onClose();
    allWins.delete(w.id);
  }
  w.close = close;
  $('.close', el).addEventListener('click', close);

  // Taskbar button: restore / minimize / focus
  btn.addEventListener('click', () => {
    if (el.classList.contains('hidden')) {
      el.classList.remove('hidden');
      focusWindow(w);
    } else if (activeWin === w) {
      minimize();
    } else {
      focusWindow(w);
    }
  });

  build(body, w, arg);
  focusWindow(w);
  return w;
}

/* =========================================================
   Apps
   ========================================================= */

/* ---- Browser ---- */
function browserApp(body, win) {
  body.innerHTML = `
    <div class="browser">
      <div class="b-bar">
        <button class="back" title="Back" disabled>&#8592;</button>
        <button class="fwd" title="Forward" disabled>&#8594;</button>
        <button class="reload" title="Reload">&#8635;</button>
        <button class="home" title="Home">&#8962;</button>
        <input class="url" type="text" placeholder="Search Wikipedia or enter a web address" spellcheck="false">
        <button class="ext" title="Open in a real browser tab">&#8599;</button>
      </div>
      <div class="b-view">
        <iframe style="display:none" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        <div class="b-home">
          <h1>Web Browser</h1>
          <div class="sites"></div>
          <small>Type a web address, or any other text to search Wikipedia. Some sites refuse to load inside other pages &mdash; use the &#8599; button to open those in a real browser tab.</small>
        </div>
      </div>
    </div>`;

  const frame = $('iframe', body);
  const home = $('.b-home', body);
  const urlInput = $('.url', body);
  const backBtn = $('.back', body);
  const fwdBtn = $('.fwd', body);

  const history = ['home'];
  let idx = 0;

  const sites = [
    ['Wikipedia', 'https://en.wikipedia.org/wiki/Main_Page'],
    ['Wikipedia: Operating system', 'https://en.wikipedia.org/wiki/Operating_system'],
    ['OpenStreetMap', 'https://www.openstreetmap.org/'],
    ['Example.com', 'https://example.com/']
  ];
  const sitesEl = $('.sites', body);
  sites.forEach(([name, url]) => {
    const s = document.createElement('div');
    s.className = 'site';
    s.textContent = name;
    s.addEventListener('click', () => go(url));
    sitesEl.appendChild(s);
  });

  function normalize(text) {
    text = text.trim();
    if (!text) return 'home';
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(text)) return text;
    if (/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(text)) return 'https://' + text;
    return 'https://en.wikipedia.org/wiki/Special:Search?search=' + encodeURIComponent(text);
  }

  function render() {
    const url = history[idx];
    if (url === 'home') {
      home.style.display = 'flex';
      frame.style.display = 'none';
      frame.src = 'about:blank';
      urlInput.value = '';
    } else {
      home.style.display = 'none';
      frame.style.display = 'block';
      frame.src = url;
      urlInput.value = url;
    }
    backBtn.disabled = idx === 0;
    fwdBtn.disabled = idx === history.length - 1;
  }

  function go(text) {
    const url = normalize(text);
    history.length = idx + 1;
    history.push(url);
    idx++;
    render();
  }

  urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(urlInput.value); });
  backBtn.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
  fwdBtn.addEventListener('click', () => { if (idx < history.length - 1) { idx++; render(); } });
  $('.reload', body).addEventListener('click', () => { if (history[idx] !== 'home') frame.src = history[idx]; });
  $('.home', body).addEventListener('click', () => go(''));
  $('.ext', body).addEventListener('click', () => {
    if (history[idx] !== 'home') window.open(history[idx], '_blank', 'noopener');
  });
}

/* ---- Notepad ---- */
function notepadApp(body, win, path) {
  body.innerHTML = `
    <div class="np">
      <div class="fm-bar">
        <button class="new">New</button><button class="open">Open</button>
        <button class="save">Save</button><button class="saveas">Save As</button>
      </div>
      <textarea class="notepad" spellcheck="false" placeholder="Start typing..."></textarea>
      <div class="np-status"></div>
    </div>`;

  const ta = $('textarea', body), status = $('.np-status', body);
  let cur = null, dirty = false;

  function refresh() {
    const name = cur ? fsSplit(cur)[1] : 'Untitled';
    win.setTitle((dirty ? '• ' : '') + name + ' - Notepad');
    status.textContent = (cur || 'Not saved yet') + (dirty ? '  (unsaved changes)' : '');
  }

  function load(p) {
    const n = fsGet(p);
    if (!n || n.type !== 'file') { osAlert('Notepad', 'Cannot open ' + p); return; }
    ta.value = n.content; cur = p; dirty = false; refresh();
  }

  async function confirmDiscard() {
    return !dirty || await osConfirm('Unsaved changes', 'Discard your unsaved changes?');
  }

  function save(p) {
    try {
      fsWrite(p, ta.value);
      cur = p; dirty = false; refresh();
      notify('Saved', p);
    } catch (e) { osAlert('Cannot save', e.message); }
  }

  async function saveAs() {
    const input = await osPrompt('Save As', 'Enter a full path:', cur || '/Documents/untitled.txt');
    if (!input || !input.trim()) return;
    const p = normPath(input.trim());
    if (fsGet(p) && p !== cur && !(await osConfirm('Replace file?', p + ' already exists. Replace it?'))) return;
    save(p);
  }

  ta.addEventListener('input', () => { if (!dirty) { dirty = true; refresh(); } });
  $('.new', body).addEventListener('click', async () => {
    if (await confirmDiscard()) { ta.value = ''; cur = null; dirty = false; refresh(); }
  });
  $('.open', body).addEventListener('click', async () => {
    if (!(await confirmDiscard())) return;
    const p = await osPrompt('Open file', 'Enter a full path:', '/Documents/');
    if (p && p.trim()) load(normPath(p.trim()));
  });
  $('.save', body).addEventListener('click', () => (cur ? save(cur) : saveAs()));
  $('.saveas', body).addEventListener('click', saveAs);

  function onKey(e) {
    if (activeWin !== win) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      cur ? save(cur) : saveAs();
    }
  }
  document.addEventListener('keydown', onKey);
  win.onClose = () => document.removeEventListener('keydown', onKey);

  if (path) load(path); else refresh();
  ta.focus();
}

/* ---- Calculator ---- */
function calculatorApp(body) {
  body.innerHTML = `<div class="calc"><div class="calc-display">0</div><div class="calc-keys"></div></div>`;
  const disp = $('.calc-display', body);
  const keys = $('.calc-keys', body);

  let cur = '0', prev = null, op = null, fresh = false;

  const layout = [
    ['C','fn'], ['±','fn'], ['%','fn'], ['÷','op'],
    ['7'], ['8'], ['9'], ['×','op'],
    ['4'], ['5'], ['6'], ['−','op'],
    ['1'], ['2'], ['3'], ['+','op'],
    ['0','zero'], ['.'], ['=','op']
  ];

  function compute(a, b, o) {
    switch (o) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
    }
    return b;
  }
  const fmt = (n) => Number.isFinite(n) ? String(parseFloat(n.toPrecision(12))) : 'Error';
  const show = () => { disp.textContent = cur; disp.style.fontSize = cur.length > 11 ? '22px' : '34px'; };

  function press(k) {
    if (cur === 'Error' && k !== 'C') { cur = '0'; prev = null; op = null; fresh = false; }
    if (/^[0-9]$/.test(k)) {
      if (fresh || cur === '0') cur = k; else if (cur.replace(/[-.]/g, '').length < 15) cur += k;
      fresh = false;
    } else if (k === '.') {
      if (fresh) { cur = '0.'; fresh = false; }
      else if (!cur.includes('.')) cur += '.';
    } else if (k === 'C') {
      cur = '0'; prev = null; op = null; fresh = false;
    } else if (k === '±') {
      if (cur !== '0') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur;
    } else if (k === '%') {
      cur = fmt(parseFloat(cur) / 100);
    } else if (k === '=') {
      if (op !== null) {
        cur = fmt(compute(prev, parseFloat(cur), op));
        op = null; prev = null; fresh = true;
      }
    } else { // + − × ÷
      if (op !== null && !fresh) {
        cur = fmt(compute(prev, parseFloat(cur), op));
      }
      if (cur !== 'Error') { prev = parseFloat(cur); op = k; fresh = true; }
    }
    show();
  }

  layout.forEach(([label, cls]) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener('click', () => press(label));
    keys.appendChild(b);
  });
}

/* ---- Settings ---- */
const wallpapers = [
  'linear-gradient(135deg, #1e3c72, #2a5298 50%, #6a85b6)',
  'linear-gradient(135deg, #0f2027, #203a43, #2c5364)',
  'linear-gradient(135deg, #42275a, #734b6d)',
  'linear-gradient(135deg, #134e5e, #71b280)',
  'linear-gradient(135deg, #cb2d3e, #ef473a)',
  'linear-gradient(135deg, #232526, #414345)'
];
function applyWallpaper(i) { desktop.style.background = wallpapers[i]; }
(function () {
  const saved = parseInt(store('wallpaper'), 10);
  if (!isNaN(saved) && wallpapers[saved]) applyWallpaper(saved);
})();

function settingsApp(body) {
  body.innerHTML = `
    <div class="settings">
      <h3>Wallpaper</h3><div class="swatches"></div>
      <h3 style="margin-top:20px">Lock screen password</h3>
      <div><span class="pw-status"></span>
        <button class="g-btn pw-set" style="margin-left:8px">Set password</button>
        <button class="g-btn secondary pw-clear">Remove</button></div>
      <h3 style="margin-top:20px">System</h3>
      <div class="sys-info"></div>
      <div style="margin-top:10px"><button class="g-btn reset-os" style="background:#ef4444">Reset WebOS</button></div>
    </div>`;
  const wrap = $('.swatches', body);
  let selected = parseInt(store('wallpaper'), 10);
  if (isNaN(selected)) selected = 0;
  wallpapers.forEach((bg, i) => {
    const s = document.createElement('div');
    s.className = 'swatch' + (i === selected ? ' sel' : '');
    s.style.background = bg;
    s.addEventListener('click', () => {
      wrap.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
      s.classList.add('sel');
      applyWallpaper(i);
      store('wallpaper', String(i));
    });
    wrap.appendChild(s);
  });

  // Password
  const pwStatus = $('.pw-status', body), clearBtn = $('.pw-clear', body), setBtn = $('.pw-set', body);
  function pwRefresh() {
    const has = hasPassword();
    pwStatus.textContent = has ? 'Password is set.' : 'No password set.';
    clearBtn.style.display = has ? '' : 'none';
    setBtn.textContent = has ? 'Change password' : 'Set password';
  }
  pwRefresh();
  setBtn.addEventListener('click', async () => {
    const p1 = await osPrompt('Set password', 'Enter a new password:', '', 'password');
    if (!p1) return;

/* ---- Snake ---- */
function snakeApp(body, win) {
  const N = 20, C = 20;
  body.innerHTML = `
    <div class="game">
      <div class="g-top"><span class="score">Score: 0</span><span class="best"></span><button class="g-btn restart">Restart</button></div>
      <canvas width="${N * C}" height="${N * C}"></canvas>
      <div class="dpad">
        <button class="up">&#9650;</button><button class="left">&#9664;</button>
        <button class="down">&#9660;</button><button class="right">&#9654;</button>
      </div>
    </div>`;

  const cv = $('canvas', body), ctx = cv.getContext('2d');
  const scoreEl = $('.score', body), bestEl = $('.best', body);
  let best = parseInt(store('snake-best'), 10) || 0;
  let snake, dir, nextDir, food, score, state; // state: ready | play | over

  const rand = (n) => Math.floor(Math.random() * n);

  function spawn() {
    do { food = { x: rand(N), y: rand(N) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateLabels() {
    scoreEl.textContent = 'Score: ' + score;
    bestEl.textContent = 'Best: ' + best;
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    state = 'ready';
    spawn();
    updateLabels();
    draw();
  }

  function endGame() {
    state = 'over';
    if (score > best) { best = score; store('snake-best', String(best)); }
    updateLabels();
    draw();
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      if (snake.length >= N * N) { endGame(); return; }
      spawn();
    } else {
      snake.pop();
    }
    updateLabels();
    draw();
  }

  function steer(dx, dy) {
    if (state === 'over') return;
    if (dx === -dir.x && dy === -dir.y) return; // no instant reversal
    nextDir = { x: dx, y: dy };
    if (state === 'ready') state = 'play';
  }

  function draw() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
      if ((x + y) % 2) ctx.fillRect(x * C, y * C, C, C);
    }
    // food
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(food.x * C + C / 2, food.y * C + C / 2, C / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    // snake
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#86efac' : '#22c55e';
      ctx.fillRect(s.x * C + 1, s.y * C + 1, C - 2, C - 2);
    });
    // overlay text
    if (state !== 'play') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, cv.height / 2 - 34, cv.width, 68);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Game over' : 'Snake', cv.width / 2, cv.height / 2 - 4);
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'Press Restart to play again' : 'Press an arrow key or tap a direction', cv.width / 2, cv.height / 2 + 20);
    }
  }

  const keyMap = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
  };
  function onKey(e) {
    if (activeWin !== win || document.body.classList.contains('locked') || !keyMap[e.key]) return;
    e.preventDefault();
    steer(...keyMap[e.key]);
  }
  document.addEventListener('keydown', onKey);

  $('.up', body).addEventListener('click', () => steer(0, -1));
  $('.down', body).addEventListener('click', () => steer(0, 1));
  $('.left', body).addEventListener('click', () => steer(-1, 0));
  $('.right', body).addEventListener('click', () => steer(1, 0));
  $('.restart', body).addEventListener('click', reset);

  const timer = setInterval(() => {
    if (state === 'play' && !win.el.classList.contains('hidden') && !document.body.classList.contains('locked')) step();
  }, 120);

  win.onClose = () => {
    clearInterval(timer);
    document.removeEventListener('keydown', onKey);
  };

  reset();
}

/* ---- Tic-Tac-Toe ---- */
function tictactoeApp(body, win) {
  body.innerHTML = `
    <div class="game">
      <div class="g-top">
        <select class="mode">
          <option value="easy">vs Computer (easy)</option>
          <option value="hard">vs Computer (hard)</option>
          <option value="two">2 players</option>
        </select>
        <button class="g-btn restart">New game</button>
      </div>
      <div class="ttt-status"></div>
      <div class="ttt-board"></div>
    </div>`;

  const boardEl = $('.ttt-board', body);
  const statusEl = $('.ttt-status', body);
  const modeEl = $('.mode', body);
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  let b, turn, result, pending = null;

  function check(bd) {
    for (const [a, c, d] of lines) {
      if (bd[a] && bd[a] === bd[c] && bd[a] === bd[d]) return { w: bd[a], line: [a, c, d] };
    }
    return bd.every(Boolean) ? { w: 'draw' } : null;
  }

  function minimax(bd, player) {
    const r = check(bd);
    if (r) return r.w === 'O' ? 1 : r.w === 'X' ? -1 : 0;
    let best = player === 'O' ? -2 : 2;
    for (let i = 0; i < 9; i++) {
      if (bd[i]) continue;
      bd[i] = player;
      const s = minimax(bd, player === 'O' ? 'X' : 'O');
      bd[i] = null;
      best = player === 'O' ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }

  function aiMove() {
    const empty = [];
    for (let i = 0; i < 9; i++) if (!b[i]) empty.push(i);
    if (!empty.length) return;
    if (modeEl.value === 'easy') {
      play(empty[Math.floor(Math.random() * empty.length)]);
      return;
    }
    let bestScore = -2, bestMove = empty[0];
    for (const i of empty) {
      b[i] = 'O';
      const s = minimax(b, 'X');
      b[i] = null;
      if (s > bestScore) { bestScore = s; bestMove = i; }
    }
    play(bestMove);
  }

  function render() {
    boardEl.innerHTML = '';
    b.forEach((v, i) => {
      const cell = document.createElement('button');
      cell.className = 'ttt-cell' + (v ? ' ' + v : '') + (result && result.line && result.line.includes(i) ? ' win' : '');
      cell.textContent = v || '';
      cell.disabled = !!v || !!result;
      cell.addEventListener('click', () => {
        if (modeEl.value !== 'two' && turn !== 'X') return; // wait for the computer
        play(i);
      });
      boardEl.appendChild(cell);
    });
    if (result) statusEl.textContent = result.w === 'draw' ? "It's a draw" : result.w + ' wins!';
    else statusEl.textContent = turn + "'s turn";
  }

  function play(i) {
    if (result || b[i]) return;
    b[i] = turn;
    result = check(b);
    if (!result) turn = turn === 'X' ? 'O' : 'X';
    render();
    if (!result && modeEl.value !== 'two' && turn === 'O') {
      pending = setTimeout(aiMove, 300);
    }
  }

  function reset() {
    clearTimeout(pending);
    b = Array(9).fill(null);
    turn = 'X';
    result = null;
    render();
  }

  $('.restart', body).addEventListener('click', reset);
  modeEl.addEventListener('change', reset);
  win.onClose = () => clearTimeout(pending);
  reset();
}

/* =========================================================
   Multiplayer: shared lobbies and cursors over a public MQTT broker
   (no game server needed: players meet on free public brokers)
   ========================================================= */
const MP_PREFIX = 'webos1';
const MP_SERVERS = [
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://broker.emqx.io:8084/mqtt',
  'wss://test.mosquitto.org:8081/'
];
const MP_PUBLIC = [
  { name: 'plaza', title: 'Plaza' }, { name: 'arcade', title: 'Arcade' }, { name: 'lounge', title: 'Lounge' },
  { name: 'garage', title: 'Garage' }, { name: 'rooftop', title: 'Rooftop' }, { name: 'basement', title: 'Basement' }
];
const MP_COLORS = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#ffffff'];
const MP_BEAT = 15000, MP_EXPIRE = 45000;
const mpEnc = new TextEncoder(), mpDec = new TextDecoder();
const mpSleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ---- Minimal MQTT 3.1.1 client over WebSocket ---- */
function mqBytes(b) { const o = new Uint8Array(2 + b.length); o[0] = b.length >> 8; o[1] = b.length & 255; o.set(b, 2); return o; }
function mqStr(s) { return mqBytes(mpEnc.encode(s)); }
function mqConcat(parts) {
  let n = 0; for (const p of parts) n += p.length;
  const o = new Uint8Array(n); let i = 0;
  for (const p of parts) { o.set(p, i); i += p.length; }
  return o;
}
function mqLen(n) {
  const o = [];
  do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0);
  return Uint8Array.from(o);
}
function mqPacket(first, parts) { const body = mqConcat(parts); return mqConcat([Uint8Array.of(first), mqLen(body.length), body]); }

function MqttLite(opts) {
  this.opts = opts; this.ws = null; this.buf = new Uint8Array(0); this.pid = 0;
  this.timer = 0; this.lastRx = 0; this.ended = false; this.url = '';
  this.onmessage = null; this.onclose = null; this._connack = null;
}
MqttLite.prototype.connect = async function () {
  let err = new Error('No server to connect to');
  for (const url of this.opts.urls) {
    if (this.ended) throw new Error('cancelled');
    try { await this._open(url); this.url = url; return url; } catch (e) { err = e; }
  }
  throw err;
};
MqttLite.prototype._open = function (url) {
  return new Promise((resolve, reject) => {
    let ws, settled = false, t;
    const fail = (e) => {
      if (settled) return;
      settled = true; clearTimeout(t);
      try { ws.onclose = null; ws.close(); } catch (_) {}
      if (this.ws === ws) this.ws = null;
      reject(e instanceof Error ? e : new Error(String(e)));
    };
    try { ws = new WebSocket(url, 'mqtt'); } catch (e) { fail(e); return; }
    ws.binaryType = 'arraybuffer';
    this.ws = ws; this.buf = new Uint8Array(0);
    t = setTimeout(() => fail(new Error('timeout')), 7000);
    this._connack = (rc) => {
      if (settled) return;
      if (rc === 0) { settled = true; clearTimeout(t); this._start(); resolve(); }
      else fail(new Error('refused (' + rc + ')'));
    };
    ws.onopen = () => this._send(this._connectPacket());
    ws.onmessage = (ev) => this._feed(new Uint8Array(ev.data));
    ws.onerror = () => {};
    ws.onclose = () => { if (!settled) fail(new Error('closed')); else this._closed(); };
  });
};
MqttLite.prototype._connectPacket = function () {
  const o = this.opts, will = o.will, ka = o.keepalive || 30;
  const flags = 0x02 | (will ? 0x04 | (will.retain ? 0x20 : 0) : 0);
  const parts = [mqStr('MQTT'), Uint8Array.of(4, flags, ka >> 8, ka & 255), mqStr(o.clientId)];
  if (will) parts.push(mqStr(will.topic), mqBytes(will.payload ? mpEnc.encode(will.payload) : new Uint8Array(0)));
  return mqPacket(0x10, parts);
};
MqttLite.prototype._start = function () {
  this.lastRx = Date.now();
  this.timer = setInterval(() => {
    if (Date.now() - this.lastRx > 50000) { try { this.ws.close(); } catch (_) {} return; }
    this._send(Uint8Array.of(0xC0, 0));
  }, 15000);
};
MqttLite.prototype._feed = function (chunk) {
  this.lastRx = Date.now();
  this.buf = this.buf.length ? mqConcat([this.buf, chunk]) : chunk;
  for (;;) {
    const b = this.buf;
    if (b.length < 2) return;
    let i = 1, mult = 1, len = 0, byte;
    do { if (i >= b.length) return; byte = b[i++]; len += (byte & 127) * mult; mult *= 128; } while ((byte & 128) && i < 5);
    if (b.length < i + len) return;
    const type = b[0] >> 4, flags = b[0] & 15, body = b.slice(i, i + len);
    this.buf = b.slice(i + len);
    this._handle(type, flags, body);
  }
};
MqttLite.prototype._handle = function (type, flags, body) {
  if (type === 2) { if (this._connack) this._connack(body[1]); }
  else if (type === 3) {
    const tl = (body[0] << 8) | body[1];
    const topic = mpDec.decode(body.subarray(2, 2 + tl));
    let idx = 2 + tl;
    if ((flags >> 1) & 3) idx += 2;
    if (this.onmessage) { try { this.onmessage(topic, body.subarray(idx)); } catch (e) {} }
  }
};
MqttLite.prototype._send = function (bytes) {
  if (this.ws && this.ws.readyState === 1) { try { this.ws.send(bytes); } catch (_) {} }
};
MqttLite.prototype._closed = function () {
  clearInterval(this.timer);
  const was = this.ended; this.ended = true;
  if (!was && this.onclose) { try { this.onclose(); } catch (e) {} }
};
MqttLite.prototype.subscribe = function (filter) {
  this.pid = (this.pid % 65535) + 1;
  this._send(mqPacket(0x82, [Uint8Array.of(this.pid >> 8, this.pid & 255), mqStr(filter), Uint8Array.of(0)]));

MqttLite.prototype.publish = function (topic, payload, retain) {
  const b = typeof payload === 'string' ? mpEnc.encode(payload) : payload;
  this._send(mqPacket(0x30 | (retain ? 1 : 0), [mqStr(topic), b]));
};
MqttLite.prototype.end = function () {
  if (this.ended) return;
  this.ended = true; clearInterval(this.timer);
  try { this._send(Uint8Array.of(0xE0, 0)); if (this.ws) this.ws.close(); } catch (_) {}
};

/* ---- State and helpers ---- */
const mpCleanName = (s) => String(s).replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 16);
const mpValidColor = (c) => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);
const mpUid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join('');
const mpMax = () => parseInt(store('mp-max'), 10) || 8;
const mpUrls = () => { const c = (store('mp-server') || '').trim(); return /^wss?:\/\//i.test(c) ? [c] : MP_SERVERS; };
const mpBase = (l) => MP_PREFIX + '/' + l.kind + '/' + l.name;
function mpTextOn(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62 ? '#111827' : '#ffffff';
}
function mpLoadProfile() {
  let p = null;
  try { p = JSON.parse(store('mp-profile') || 'null'); } catch (e) {}
  const name = p && typeof p.name === 'string' ? mpCleanName(p.name) : '';
  const color = p && mpValidColor(p.color) ? p.color : MP_COLORS[Math.floor(Math.random() * 9)];
  return { name: name || 'Player' + (100 + Math.floor(Math.random() * 900)), color };
}

const MP = {
  status: 'offline',          // offline | connecting | online
  lobby: null,                // { kind: 'pub' | 'prv', name, title, code? }
  error: '', server: '',
  me: Object.assign({ uid: mpUid(), x: 0.5, y: 0.5, vis: false, joined: 0 }, mpLoadProfile()),
  players: new Map()          // uid -> { uid, name, color, x, y, vis, seen }
};
const mpSubs = new Set();
const mpLast = { x: 0.5, y: 0.5, seen: false };
let mpRoom = null, mpToken = 0, mpBeatTimer = 0, mpSweepTimer = 0, mpSendTimer = 0, mpDirty = false, mpProfTimer = 0;

const mpEmitUI = () => mpSubs.forEach(fn => { try { fn(); } catch (e) {} });
function mpEmit() { mpSyncCursors(); mpUpdateTray(); mpEmitUI(); }

/* ---- Cursor layer ---- */
const mpLayer = document.createElement('div');
mpLayer.id = 'mp-layer';
document.body.appendChild(mpLayer);
const mpEls = new Map();
const MP_ARROW = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 2.5 L3 19.5 L7.4 15.4 L10.4 22 L13.4 20.7 L10.5 14.2 L16.5 14.2 Z" fill="currentColor" stroke="#0b1020" stroke-width="1.6" stroke-linejoin="round"/></svg>';
function mpEntry(uid) {
  let e = mpEls.get(uid);
  if (!e) {
    const el = document.createElement('div');
    el.className = 'mp-cursor' + (uid === MP.me.uid ? ' me' : '');
    el.innerHTML = '<div class="mp-arrow">' + MP_ARROW + '</div><div class="mp-label"></div>';
    mpLayer.appendChild(el);
    e = { el, arrow: el.firstChild, label: el.lastChild };
    mpEls.set(uid, e);
  }
  return e;
}
const mpRec = (uid) => (uid === MP.me.uid ? MP.me : MP.players.get(uid));
function mpMoveCursor(uid) {
  const p = mpRec(uid); if (!p) return;
  const e = mpEntry(uid);
  e.el.style.transform = 'translate(' + (p.x * innerWidth).toFixed(1) + 'px,' + (p.y * innerHeight).toFixed(1) + 'px)';
  e.el.style.opacity = p.vis ? '1' : '0';
}
function mpSyncCursors() {
  const want = new Set();
  if (MP.status === 'online') { want.add(MP.me.uid); MP.players.forEach((p, uid) => want.add(uid)); }
  for (const [uid, e] of mpEls) if (!want.has(uid)) { e.el.remove(); mpEls.delete(uid); }
  want.forEach(uid => {
    const p = mpRec(uid), e = mpEntry(uid);
    e.label.textContent = p.name;
    e.label.style.background = p.color; e.label.style.color = mpTextOn(p.color);
    e.arrow.style.color = p.color;
    mpMoveCursor(uid);

}
function mpRipple(x, y, color) {
  const r = document.createElement('div');

  r.style.left = (x * innerWidth) + 'px'; r.style.top = (y * innerHeight) + 'px';
  r.style.borderColor = color;
  mpLayer.appendChild(r);
  setTimeout(() => r.remove(), 750);
}
window.addEventListener('resize', mpSyncCursors);

/* ---- Tray indicator ---- */
const mpTray = document.createElement('span');
mpTray.id = 'mp-tray'; mpTray.style.display = 'none';
$('#tray').prepend(mpTray);
mpTray.addEventListener('click', () => openMultiplayer());
function mpUpdateTray() {
  if (MP.status === 'offline') { mpTray.style.display = 'none'; return; }
  mpTray.style.display = '';
  mpTray.textContent = (MP.status === 'online' ? '\u{1F465} ' + (MP.players.size + 1) : '\u{1F465} …');

function openMultiplayer() {

  if (ex) { ex.el.classList.remove('hidden'); focusWindow(ex); } else launch(appById('multiplayer'));
}

/* ---- Pointer tracking (mouse and touch) ---- */
let mpRaf = 0;
function mpOnPointer(e) {
  mpLast.x = Math.min(1, Math.max(0, e.clientX / (innerWidth || 1)));
  mpLast.y = Math.min(1, Math.max(0, e.clientY / (innerHeight || 1)));
  mpLast.seen = true;
  if (MP.status !== 'online') return;
  MP.me.x = mpLast.x; MP.me.y = mpLast.y; MP.me.vis = true; mpDirty = true;
  if (!mpRaf) mpRaf = requestAnimationFrame(() => { mpRaf = 0; mpMoveCursor(MP.me.uid); });
}
document.addEventListener('pointermove', mpOnPointer, { capture: true, passive: true });
document.addEventListener('pointerdown', (e) => {
  mpOnPointer(e);
  if (MP.status !== 'online') return;
  mpPub('/k/', Math.round(MP.me.x * 1000) + ',' + Math.round(MP.me.y * 1000), false);
  mpRipple(MP.me.x, MP.me.y, MP.me.color);

document.documentElement.addEventListener('mouseleave', () => {
  if (MP.status !== 'online') return;
  MP.me.vis = false; mpDirty = true; mpMoveCursor(MP.me.uid);
});

/* ---- Publishing ---- */
function mpPub(sub, payload, retain) {
  if (!mpRoom || !MP.lobby) return;
  mpRoom.publish(mpBase(MP.lobby) + sub + MP.me.uid, payload, retain);
}
function mpPublishPresence() {
  mpPub('/p/', JSON.stringify({ n: MP.me.name, c: MP.me.color, j: MP.me.joined }), true);
}
function mpClearPresence() {
  if (mpRoom && MP.lobby) mpRoom.publish(mpBase(MP.lobby) + '/p/' + MP.me.uid, '', true);
}
function mpSetProfile(patch) {
  if (patch.name !== undefined) { const n = mpCleanName(patch.name); if (n) MP.me.name = n; }
  if (patch.color !== undefined && mpValidColor(patch.color)) MP.me.color = patch.color.toLowerCase();
  store('mp-profile', JSON.stringify({ name: MP.me.name, color: MP.me.color }));
  if (MP.status === 'online') { clearTimeout(mpProfTimer); mpProfTimer = setTimeout(mpPublishPresence, 250); }
  mpEmit();
}

/* ---- Incoming messages ---- */
function mpOnMessage(token, base, topic, payload) {
  if (token !== mpToken || topic.indexOf(base + '/') !== 0) return;
  const parts = topic.slice(base.length + 1).split('/');
  const type = parts[0], uid = parts[1];
  if (parts.length !== 2 || !/^[0-9a-f]{12}$/.test(uid) || uid === MP.me.uid) return;
  const text = mpDec.decode(payload);
  if (type === 'p') {
    if (!text) {
      const p = MP.players.get(uid);
      if (p) { MP.players.delete(uid); if (MP.status === 'online') notify('Multiplayer', p.name + ' left'); mpEmit(); }
      return;
    }
    let j; try { j = JSON.parse(text); } catch (e) { return; }
    if (!j || typeof j !== 'object') return;
    const name = mpCleanName(j.n || '') || 'Player', color = mpValidColor(j.c) ? j.c.toLowerCase() : '#3b82f6';
    let p = MP.players.get(uid), isNew = !p;
    if (!p) { p = { uid, x: 0.5, y: 0.5, vis: false }; MP.players.set(uid, p); }
    const changed = isNew || p.name !== name || p.color !== color;
    p.name = name; p.color = color; p.seen = Date.now();
    if (isNew && MP.status === 'online') { notify('Multiplayer', name + ' joined'); mpDirty = true; }
    if (changed) mpEmit();
  } else if (type === 'c') {
    const p = MP.players.get(uid); if (!p) return;
    const a = text.split(',');
    const x = +a[0] / 1000, y = +a[1] / 1000;
    if (!(x >= 0 && x <= 1 && y >= 0 && y <= 1)) return;
    p.x = x; p.y = y; p.vis = a[2] !== '0'; p.seen = Date.now();
    mpMoveCursor(uid);
  } else if (type === 'k') {
    const p = MP.players.get(uid); if (!p) return;
    const a = text.split(','), x = +a[0] / 1000, y = +a[1] / 1000;
    if (x >= 0 && x <= 1 && y >= 0 && y <= 1) mpRipple(x, y, p.color);
  }
}

/* ---- Joining, leaving, reconnecting ---- */
function mpStopTimers() { clearInterval(mpBeatTimer); clearInterval(mpSweepTimer); clearInterval(mpSendTimer); }
function mpStartTimers(token) {
  mpStopTimers();
  mpBeatTimer = setInterval(() => { if (token === mpToken) mpPublishPresence(); }, MP_BEAT);
  mpSweepTimer = setInterval(() => {
    if (token !== mpToken || !mpRoom) return;
    const now = Date.now(); let changed = false;
    MP.players.forEach((p, uid) => {
      if (now - p.seen > MP_EXPIRE) {
        MP.players.delete(uid); changed = true;
        mpRoom.publish(mpBase(MP.lobby) + '/p/' + uid, '', true);   // tidy up a dead player's leftover entry
      }
    });
    if (changed) mpEmit();
  }, 5000);
  mpSendTimer = setInterval(() => {
    if (token !== mpToken || !mpDirty || MP.status !== 'online') return;
    mpDirty = false;
    mpPub('/c/', Math.round(MP.me.x * 1000) + ',' + Math.round(MP.me.y * 1000) + ',' + (MP.me.vis ? 1 : 0), false);
  }, 80);
}
function mpDropRoom(clean) {
  if (!mpRoom) return;
  const c = mpRoom; mpRoom = null; c.onclose = null;
  if (clean && MP.lobby) { try { c.publish(mpBase(MP.lobby) + '/p/' + MP.me.uid, '', true); } catch (e) {} }
  c.end();
}
async function mpOpenRoom(token, opts) {
  const base = mpBase(MP.lobby);
  const conn = new MqttLite({ urls: mpUrls(), clientId: 'w' + MP.me.uid, will: { topic: base + '/p/' + MP.me.uid, retain: true }, keepalive: 30 });
  conn.onmessage = (t, p) => mpOnMessage(token, base, t, p);
  conn.onclose = () => mpOnClose(token, conn);
  mpRoom = conn;
  const abandon = (msg, cancelled) => {
    if (mpRoom === conn) mpRoom = null;
    conn.onclose = null; conn.end();
    return Object.assign(new Error(msg), { cancelled: !!cancelled });
  };
  try { MP.server = await conn.connect(); }
  catch (e) { throw abandon('Could not reach a lobby server. Check your internet connection.', token !== mpToken); }
  if (token !== mpToken) throw abandon('cancelled', true);
  conn.subscribe(base + '/#');
  await mpSleep(900);   // let the existing players' entries arrive
  if (token !== mpToken) throw abandon('cancelled', true);
  if (!opts.reconnect) {
    if (MP.players.size >= mpMax()) throw abandon('That lobby is full.');
    if (opts.needOthers && MP.players.size === 0) throw abandon('Nobody is in that lobby. Check the code, or create a private lobby instead.');
  }
  MP.me.joined = Date.now();
  mpPublishPresence();
  MP.status = 'online'; MP.error = '';
  if (mpLast.seen) { MP.me.x = mpLast.x; MP.me.y = mpLast.y; MP.me.vis = true; }
  mpDirty = true;
  mpStartTimers(token);
  mpEmit();
}
async function mpJoin(lobby, opts) {
  opts = opts || {};
  mpDropRoom(true); mpStopTimers();
  const token = ++mpToken;
  mpBrowseStop();
  MP.status = 'connecting'; MP.lobby = lobby; MP.error = ''; MP.players = new Map();
  mpEmit();
  try { await mpOpenRoom(token, opts); }
  catch (e) { if (e.cancelled || token !== mpToken) return; mpFinish(e.message); }
}
function mpFinish(msg) {
  mpDropRoom(false); mpStopTimers();
  MP.status = 'offline'; MP.lobby = null; MP.players = new Map(); MP.error = msg || '';
  mpEmit();
  if (mpBrowseWant > 0) mpBrowseStart();
}
function mpLeave() {
  mpToken++;
  mpDropRoom(true); mpStopTimers();
  const was = MP.status !== 'offline';
  MP.status = 'offline'; MP.lobby = null; MP.players = new Map(); MP.error = '';
  if (was) mpEmit();
  if (mpBrowseWant > 0) mpBrowseStart();
}
function mpOnClose(token, conn) {
  if (token !== mpToken || mpRoom !== conn) return;
  mpRoom = null; mpStopTimers();
  MP.players = new Map(); MP.status = 'connecting';
  mpEmit();
  mpReconnect(token);
}
async function mpReconnect(token) {
  for (const d of [1000, 2000, 4000, 8000, 15000]) {
    await mpSleep(d);
    if (token !== mpToken) return;
    try { await mpOpenRoom(token, { reconnect: true }); return; }
    catch (e) { if (e.cancelled || token !== mpToken) return; }
  }
  if (token === mpToken) mpFinish('Lost connection to the lobby server.');
}
window.addEventListener('pagehide', () => { if (mpRoom) mpDropRoom(true); });

/* ---- Lobby list (read-only connection that watches public lobbies) ---- */
const mpPresence = new Map();   // 'lobby/uid' -> last seen
let mpBrowseConn = null, mpBrowseWant = 0, mpBrowseState = 'idle', mpBrowseTimer = 0;
function mpCounts() {
  const now = Date.now(), c = {};
  for (const [k, seen] of mpPresence) if (now - seen < MP_EXPIRE) { const n = k.split('/')[0]; c[n] = (c[n] || 0) + 1; }
  return c;
}
async function mpBrowseStart() {
  if (mpBrowseConn || mpBrowseWant <= 0 || MP.status !== 'offline') return;
  clearTimeout(mpBrowseTimer);
  mpBrowseState = 'connecting'; mpEmitUI();
  const conn = new MqttLite({ urls: mpUrls(), clientId: 'b' + mpUid(), keepalive: 30 });
  mpBrowseConn = conn;
  const retry = () => { if (mpBrowseConn === conn) { mpBrowseConn = null; mpBrowseState = 'error'; mpEmitUI(); mpBrowseTimer = setTimeout(mpBrowseStart, 4000); } };
  conn.onmessage = (topic, payload) => {
    const m = topic.match(/^webos1\/pub\/([a-z]+)\/p\/([0-9a-f]{12})$/);
    if (!m) return;
    const k = m[1] + '/' + m[2];
    if (payload.length === 0) mpPresence.delete(k); else mpPresence.set(k, Date.now());
    mpEmitUI();
  };
  conn.onclose = retry;
  try { MP.server = await conn.connect(); } catch (e) { retry(); return; }
  if (mpBrowseConn !== conn) { conn.end(); return; }
  mpPresence.clear();
  conn.subscribe(MP_PREFIX + '/pub/+/p/+');
  mpBrowseState = 'live'; mpEmitUI();
}
function mpBrowseStop() {
  clearTimeout(mpBrowseTimer);
  if (mpBrowseConn) { const c = mpBrowseConn; mpBrowseConn = null; c.onclose = null; c.end(); }
  mpBrowseState = 'idle';
}
function mpBrowseWatch(delta) {
  mpBrowseWant = Math.max(0, mpBrowseWant + delta);
  if (mpBrowseWant > 0) mpBrowseStart(); else mpBrowseStop();
}

  let results = null, tab = 'recent', current = null;

  const ID_RE = /^[\w-]{11}$/;

  const decode = (s) => { const t = document.createElement('textarea'); t.innerHTML = String(s || ''); return t.value; };

  /* ---- Turn whatever the user typed into something playable ---- */
  function parse(text) {
    text = text.trim();
    if (!text) return null;
    let u = null;
    if (/^https?:\/\//i.test(text)) { try { u = new URL(text); } catch (e) {} }
    else if (/^(www\.|m\.|music\.)?(youtube(-nocookie)?\.com|youtu\.be)\//i.test(text)) { try { u = new URL('https://' + text); } catch (e) {} }
    if (u) {
      const host = u.hostname.toLowerCase().replace(/^(www|m|music)\./, '');
      const parts = u.pathname.split('/').filter(Boolean);
      const list = u.searchParams.get('list');
      let id = null;
      if (host === 'youtu.be') id = parts[0];
      else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
        if (u.searchParams.get('v')) id = u.searchParams.get('v');
        else if (['shorts', 'live', 'embed', 'v'].includes(parts[0])) id = parts[1];
      } else return { type: 'external', url: u.href };
      if (id === 'videoseries') id = null;
      if (id && ID_RE.test(id)) return { type: 'video', id, list: list && /^[\w-]+$/.test(list) ? list : null };
      if (list && /^[\w-]+$/.test(list)) return { type: 'list', list };
      return { type: 'external', url: u.href };
    }
    if (ID_RE.test(text) && /[A-Z0-9_-]/.test(text)) return { type: 'video', id: text, list: null };
    return { type: 'search', q: text };
  }
  function embedUrl(it) {
    const base = 'https://www.youtube-nocookie.com/embed/', q = 'autoplay=1&rel=0&playsinline=1';

  async function fetchTitle(h) {

    if (opts.id) {
      th = document.createElement('img');
      th.src = 'https://i.ytimg.com/vi/' + encodeURIComponent(opts.id) + '/mqdefault.jpg';
      th.alt = ''; th.loading = 'lazy';
      th.addEventListener('error', () => { th.style.visibility = 'hidden'; });
    } else { th = document.createElement('div'); th.textContent = '☰'; }
    th.className = 'th';
    const meta = document.createElement('div');
    meta.style.minWidth = '0';
    const t = document.createElement('div'); t.className = 't'; t.textContent = opts.title;
    const a = document.createElement('div'); a.className = 'a'; a.textContent = opts.author || '';
    meta.append(t, a);
    r.append(th, meta);
    r.addEventListener('click', opts.onclick);
    return r;
  }
  function empty(text, btn) {
    const d = document.createElement('div');
    d.className = 'yt-empty';
    d.textContent = text;
    if (btn) { const b = document.createElement('button'); b.className = 'g-btn'; b.textContent = btn[0]; b.addEventListener('click', btn[1]); d.appendChild(document.createElement('br')); d.appendChild(b); }
    listEl.appendChild(d);
  }
  function renderList() {
    listEl.innerHTML = '';
    tabBtns.forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    clearBtn.style.display = tab === 'recent' && hist.length ? '' : 'none';
    if (tab === 'recent') {
      if (!hist.length) { empty('Videos you watch will show up here.'); return; }
      hist.forEach(h => listEl.appendChild(row({
        id: h.type === 'list' ? null : h.id,
        title: h.title || (h.type === 'list' ? 'Playlist' : h.id),
        author: h.author,
        onclick: () => play(h.type === 'list' ? { type: 'list', list: h.list } : { type: 'video', id: h.id, list: h.list })
      })));
      return;
    }
    if (!results) { empty('Type something in the box and press Go to search.'); return; }
    if (results.state === 'loading') { empty('Searching...'); return; }
    if (results.state === 'error') { empty(results.msg); return; }
    if (results.state === 'nokey') {
      empty('To search inside this app, add a YouTube Data API key with the ⚙ button. You can also search on YouTube itself.',
        ['Search YouTube ↗', () => window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(results.q), '_blank', 'noopener')]);
      return;
    }
    results.items.forEach(it => listEl.appendChild(row({
      id: it.id, title: it.title, author: it.author,
      onclick: () => play({ type: 'video', id: it.id, list: null }, { title: it.title, author: it.author })
    })));
  }

  /* ---- Wiring ---- */
  function go() {
    const p = parse(input.value);
    if (!p) return;
    if (p.type === 'search') { search(p.q); return; }
    if (p.type === 'external') {
      notify('YouTube', "That link can't be played here, so it is opening in a new tab.");
      window.open(p.url, '_blank', 'noopener');
      return;
    }
    play(p);
  }
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  $('.yt-go', body).addEventListener('click', go);
  $('.yt-ext', body).addEventListener('click', () => {
    const p = parse(input.value);
    let url = 'https://www.youtube.com/';
    if (p && p.type === 'search') url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(p.q);
    else if (p && (p.type === 'video' || p.type === 'list')) url = watchUrl(p);
    else if (p && p.type === 'external') url = p.url;
    else if (current) url = watchUrl(current);
    window.open(url, '_blank', 'noopener');
  });
  $('.yt-key', body).addEventListener('click', async () => {
    const cur = store('yt-key') || '';
    const v = await osPrompt('YouTube search', 'Optional: paste a YouTube Data API v3 key to search inside this app. It is stored only in this browser. Leave empty to remove it.', cur);
    if (v === null) return;
    if (v.trim()) { store('yt-key', v.trim()); notify('YouTube', 'Search key saved'); }
    else { try { localStorage.removeItem('webos.yt-key'); } catch (e) {} notify('YouTube', 'Search key removed'); }
  });
  tabBtns.forEach(b => b.addEventListener('click', () => { tab = b.dataset.t; renderList(); }));
  clearBtn.addEventListener('click', async () => {
    if (await osConfirm('Clear history', 'Remove all recent videos?')) { hist = []; saveHist(); renderList(); }
  });

  // Clicking inside the player doesn't reach the page, so notice it through the window losing focus
  const onBlur = () => setTimeout(() => { if (document.activeElement === frame) focusWindow(win); }, 0);
  window.addEventListener('blur', onBlur);
  win.onClose = () => window.removeEventListener('blur', onBlur);

  renderList();
  input.focus();
}

  const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const DIRS8 = [...DIRS4, [1, 1], [1, -1], [-1, 1], [-1, -1]];

  function reset() {
    P = { x: 2.5, y: 2.5, a: 0.6, hp: 100, ammo: 24, cool: 0 };
    enemies = ENEMY_SPAWNS.map(([x, y, t], i) => ({ id: i, x, y, type: t, hp: TYPES[t].hp, st: 'idle', cd: 1 + Math.random() * 1.5, hurt: 0, stun: 0 }));

  const solid = (x, y) => MAPW[(y | 0) * MW + (x | 0)] > 0;

    if (self !== P && Math.hypot(x - P.x, y - P.y) < 0.55) return true;
    if (self === P) for (const e of enemies) if (e.st !== 'dead' && Math.hypot(x - e.x, y - e.y) < 0.5) return true;
    return false;
  }
  function moveEntity(o, dx, dy, r) {
    if (!blocked(o.x + dx, o.y, r, o)) o.x += dx;
    if (!blocked(o.x, o.y + dy, r, o)) o.y += dy;
  }
  function los(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0, n = Math.ceil(Math.hypot(dx, dy) / 0.12);
    for (let i = 1; i < n; i++) if (solid(x0 + dx * i / n, y0 + dy * i / n)) return false;
    return true;
  }
  function computeFlow() {
    const c = (P.y | 0) * MW + (P.x | 0);

    const q = [c];
    for (let i = 0; i < q.length; i++) {
      const k = q[i], x = k % MW, y = (k / MW) | 0;
      for (const [dx, dy] of DIRS4) {
        const nx = x + dx, ny = y + dy;

        const nk = ny * MW + nx;

    let best = cur, bx = -1, by = -1;
    for (const [dx, dy] of DIRS8) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
      const nk = ny * MW + nx;
      if (MAPW[nk]) continue;
      if (dx && dy && (MAPW[cy * MW + nx] || MAPW[ny * MW + cx])) continue;
      const f = flow[nk];
      if (f >= 0 && f < best) { best = f; bx = nx; by = ny; }
    }
    return bx < 0 ? null : { x: bx + 0.5, y: by + 0.5 };
  }
  function castDist(x, y, ang) {
    const rdx = Math.cos(ang), rdy = Math.sin(ang);
    let mx = x | 0, my = y | 0;
    const ddx = Math.abs(1 / rdx), ddy = Math.abs(1 / rdy);
    let sdx, sdy, stepX, stepY;

  function say(t) { msg = t; msgT = 1.6; }
  function hurtPlayer(n) {
    if (state !== 'play') return;
